
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>學習角落｜我的學習小天地</title>
<style>
:root{
  font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;
  color:#263449;background:#f4f7fb
}
*{box-sizing:border-box}
body{margin:0}
button,input,select,textarea{font:inherit}
button{
  border:0;border-radius:9px;padding:10px 14px;
  background:#2563eb;color:white;cursor:pointer
}
button.secondary{background:#e7eef8;color:#30415d}
button.danger{background:#c43d43}
button:disabled{opacity:.55;cursor:not-allowed}
input:not([type=checkbox]),select,textarea{
  width:100%;padding:10px;border:1px solid #cbd5e1;
  border-radius:8px;background:white
}
input[type=checkbox]{width:18px;height:18px;accent-color:#2563eb}
textarea{min-height:80px}
.shell{max-width:1150px;margin:auto;padding:18px}
.panel{
  background:white;border-radius:16px;padding:20px;
  margin:15px 0;box-shadow:0 3px 16px #142a4910
}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.hide{display:none!important}
.muted{color:#64748b}
.error{color:#b91c1c}
.success{color:#047857}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}
.tabs button{background:#e2e8f0;color:#334155}
.tabs button.active{background:#2563eb;color:white}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.formgrid label{display:grid;gap:5px}
.full{grid-column:1/-1}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stat{background:#edf4ff;padding:15px;border-radius:12px}
.stat strong{display:block;font-size:24px}
.item{
  border:1px solid #e2e8f0;border-radius:12px;
  padding:16px;margin:12px 0;overflow-wrap:anywhere
}
.item h3{margin:9px 0}
.pill{
  display:inline-block;background:#eaf1ff;color:#2457a6;
  border-radius:99px;padding:5px 10px;font-size:13px
}
.status{
  display:inline-block;border-radius:99px;
  padding:5px 10px;font-size:13px;font-weight:650
}
.status.unchecked{background:#e2e8f0;color:#475569}
.status.done,.status.present{background:#dcfce7;color:#166534}
.status.correct{background:#fef3c7;color:#92400e}
.status.missing,.status.leave{background:#fee2e2;color:#991b1b}
.empty{padding:22px;text-align:center;color:#64748b}
.curriculum-box{
  border:1px solid #cbdff9;background:#f8fbff;
  border-radius:13px;padding:16px
}
.section-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.section-check,.student-check{
  display:flex!important;flex-direction:row!important;
  align-items:center;gap:8px;padding:10px;
  background:white;border:1px solid #e2e8f0;border-radius:9px
}
.student-list{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;
  margin-top:10px
}
.today-card{
  background:linear-gradient(120deg,#e9f1ff,#f6faff);
  border:1px solid #d3e3ff;border-radius:14px;padding:20px
}
.today-card h2{margin:8px 0}
.schedule{display:flex;flex-wrap:wrap;gap:8px}
.schedule span{
  padding:8px 12px;background:white;border:1px solid #dbe4f0;
  border-radius:10px
}
.hw-day{border:1px solid #dbe4f0;border-radius:13px;margin:14px 0;overflow:hidden}
.day-head{background:#edf4ff;padding:13px 16px;font-weight:650}
.hw-body{padding:4px 15px}
.hw-row{
  display:flex;justify-content:space-between;gap:14px;
  flex-wrap:wrap;align-items:center;padding:15px 0;
  border-bottom:1px solid #edf0f5
}
.hw-row:last-child{border:0}
.hw-info{flex:1;min-width:200px}
.hw-controls{min-width:170px}
.filterbar{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin:14px 0}
.filterbar label{display:grid;gap:5px;min-width:160px}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:480px}
th,td{border-bottom:1px solid #e2e8f0;padding:12px;text-align:left}
th{background:#f8fafc}
#message{white-space:pre-wrap}
@media(max-width:650px){
  .shell{padding:12px}
  .panel{padding:15px}
  .formgrid,.grid,.section-list,.student-list{grid-template-columns:1fr}
  .hw-controls{width:100%}
}

/* 學習角落 · Mobile-first 可愛手帳主題 */
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#574e4b;background:#fff8ed}
body{background:radial-gradient(circle at 85% 0%,#ffe9d5 0,transparent 33%),linear-gradient(180deg,#fff5e4,#fffaf3 45%,#f8f4eb);min-height:100vh}
.shell{max-width:1050px;padding:16px 14px 108px}
h1{font-size:clamp(25px,5vw,36px);margin:5px 0;color:#6e5547;letter-spacing:1px}
h2,h3{color:#685247}h2{font-size:1.28rem}
.top{gap:14px}.muted{color:#9b8b80}
.panel{background:#fffefa;border:2px solid #f4e8d7;border-radius:25px;box-shadow:0 8px 0 #eadbc638,0 14px 30px #8c725417;padding:20px;margin:17px 0}
button{border-radius:15px;background:#db8d8d;color:white;font-weight:700;min-height:43px;box-shadow:0 3px 0 #c4777770;transition:transform .12s,background .12s}
button:active{transform:translateY(2px)}button.secondary{background:#f5e8d2;color:#795e4e;box-shadow:none}button.danger{background:#c9666b}
input:not([type=checkbox]),select,textarea{border:2px solid #eee1d1;border-radius:14px;padding:12px;background:#fffefa;min-height:44px}
input:focus,textarea:focus,select:focus{outline:3px solid #f4d5d8;border-color:#df9c9c}
input[type=checkbox]{accent-color:#db8d8d}
.stat{background:#fff0d5;border:1px solid #f2dfbd;border-radius:19px;padding:16px}
.stat:nth-child(2){background:#fbe6e8;border-color:#f5d3d8}.stat:nth-child(3){background:#e4f2e4;border-color:#d4e9d7}
.stat strong{font-size:29px;color:#685247}.item,.hw-day{border:2px solid #f2e8db;border-radius:19px;background:#fffefa;overflow:hidden}
.pill{background:#f9e6ed;color:#a55d79}.status.done,.status.present{background:#dff1dc;color:#47784b}.status.correct{background:#fff0c9;color:#a27934}
.curriculum-box,.today-card{background:linear-gradient(125deg,#fff0d6,#fff9ec);border:2px solid #f3dfc0;border-radius:21px}
.day-head{background:#fff0d6;color:#785c48}.schedule span{border-radius:14px;border-color:#f0e2cf}
.tabs{display:flex;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:9px;padding:4px 2px 10px;position:sticky;top:0;z-index:10;background:#fff8edf5;backdrop-filter:blur(10px)}
.tabs::-webkit-scrollbar{display:none}.tabs button{white-space:nowrap;flex:0 0 auto;background:#f4e9d8;color:#836b5b;box-shadow:none;border:1px solid #ebddc9}
.tabs button.active{background:#e8a2a5;color:#fff;border-color:#e8a2a5}
.bottom-note{text-align:center;color:#ad9283;font-size:13px;margin:24px auto}
.pet-stage{background:linear-gradient(180deg,#ffedce,#f8dfb8);border:3px solid #f2d6a4;border-radius:25px;padding:22px;text-align:center}
.pet-emoji{font-size:88px;line-height:1.4;filter:drop-shadow(0 8px 1px #b18c5733)}
.pet-name{font-size:24px;font-weight:850;color:#73513d}.pet-bar{height:17px;background:#fffaf0;border-radius:99px;overflow:hidden;border:1px solid #e9cfab}.pet-fill{height:100%;background:linear-gradient(90deg,#a7d7a5,#7fba8d);border-radius:99px}
.pet-feed-list{display:grid;gap:10px;margin-top:14px}.pet-feed-row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff9ef;padding:12px;border-radius:15px;border:1px solid #eee0c9}
.diary-moods{display:flex;gap:8px;flex-wrap:wrap}.diary-moods label{display:flex;align-items:center;gap:4px;padding:8px 10px;border-radius:14px;background:#fff1e2;border:1px solid #f0ddc7}
.diary-entry{padding:15px;border-radius:18px;background:#fff6e9;border:1px solid #f0e1cd;margin:12px 0;white-space:pre-wrap;overflow-wrap:anywhere}
@media(max-width:650px){.shell{padding:12px 12px 115px}.panel{padding:15px}.formgrid,.grid,.section-list,.student-list{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hw-controls{width:100%}.tabs{position:fixed;bottom:0;top:auto;left:0;right:0;z-index:100;background:#fff8ecf7;border-top:2px solid #ecdcc7;margin:0;padding:10px 12px max(12px,env(safe-area-inset-bottom));box-shadow:0 -6px 22px #5d483419}.tabs button{min-width:87px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:55px;font-size:12px;padding:8px 10px;border-radius:14px}.pet-emoji{font-size:76px}.pet-feed-row{flex-wrap:wrap}.pet-feed-row button{width:100%}}
/* 手機優先：可收合側邊導覽 */
.menu-toggle{position:fixed;top:14px;right:14px;z-index:205;background:#fff0d5;color:#795844;border:2px solid #eed3ac;border-radius:16px;box-shadow:0 4px 15px #73563d22;font-weight:800;min-height:48px}
.tabs{position:fixed!important;top:0!important;left:0!important;bottom:0!important;right:auto!important;width:min(285px,82vw)!important;display:flex!important;flex-direction:column!important;align-items:stretch!important;flex-wrap:nowrap!important;overflow-y:auto!important;overflow-x:hidden!important;padding:78px 15px 24px!important;margin:0!important;background:#fffaf0!important;z-index:204!important;box-shadow:10px 0 30px #533a3026!important;border:0!important;transform:translateX(-110%);transition:transform .25s ease;gap:9px!important}
.tabs.open{transform:translateX(0)}.tabs button{white-space:normal!important;flex:0 0 auto!important;min-height:49px!important;text-align:left!important;display:block!important;width:100%!important;font-size:15px!important;padding:12px 16px!important}
.nav-shade:not([hidden]){position:fixed;inset:0;background:#49362b66;z-index:203;display:block}
.shell{padding-bottom:24px!important}.pet-stage{position:relative;overflow:hidden}
.pet-emoji.celebrate{animation:petHop .65s ease 2}.pet-stage.sparkle{animation:petGlow .8s ease}
@keyframes petHop{0%,100%{transform:translateY(0) scale(1)}35%{transform:translateY(-24px) rotate(-9deg) scale(1.12)}65%{transform:translateY(-9px) rotate(9deg)}}
@keyframes petGlow{0%,100%{box-shadow:none}50%{box-shadow:0 0 36px #ffc95a}}
.feed-fx{position:fixed;inset:0;pointer-events:none;z-index:300;overflow:hidden}.feed-fx span{position:absolute;left:50%;top:50%;font-size:27px;animation:burst .95s ease-out forwards;--dx:0px;--dy:0px}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(.4);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.2) rotate(35deg);opacity:0}}
@media(prefers-reduced-motion:reduce){.pet-emoji.celebrate,.pet-stage.sparkle,.feed-fx span{animation:none!important}.tabs{transition:none}}

/* 2026 學習角落寵物與獎品 */
.pet-emoji{transition:font-size .8s ease,transform .4s;transform-origin:bottom center;display:inline-block}
.pet-stage{background:linear-gradient(180deg,#ffe7ec,#fbe3c6 76%);min-height:310px}
.reward-card{margin:20px 0;padding:18px;border-radius:22px;background:#fff8f5;border:2px solid #f6e1e8}
.gift-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:15px 0}
.gift-box{min-height:105px;border-radius:18px;background:linear-gradient(#f9e2eb,#fff5f8);border:2px solid #f0cddc;color:#9c647c;font-size:42px;padding:10px 3px}
.gift-box small{display:block;font-size:12px;color:#93677a;margin-top:5px}
.bag-row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:12px 0;border-bottom:1px dashed #ecd7dd}
.pet-modal{position:fixed;inset:0;z-index:400;background:#4d354c80;display:grid;place-items:center;padding:16px}
.pet-dialog{background:#fffaf6;border-radius:24px;padding:20px;width:min(440px,100%);max-height:85vh;overflow-y:auto}
.pet-choice-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:15px 0}
.pet-choice{font-size:32px;background:#fff1f3;border:2px solid #f3e2e8;color:#604a55;padding:12px 3px;border-radius:15px}
.pet-choice.chosen{border-color:#d47c9e;background:#f8d9e5}
.food-fly{position:absolute;bottom:8px;left:50%;font-size:43px;animation:foodFly 1s ease-in forwards;pointer-events:none}
@keyframes foodFly{0%{transform:translate(-50%,30px) scale(1);opacity:1}90%{transform:translate(-50%,-155px) scale(.5);opacity:1}100%{transform:translate(-50%,-170px) scale(.1);opacity:0}}
.evo-overlay{position:fixed;inset:0;z-index:500;display:grid;place-items:center;background:#f9dfe8df;overflow:hidden;pointer-events:none}
.evo-popup{z-index:2;text-align:center;background:#fff8f2;border-radius:28px;padding:30px 18px;font-size:26px;font-weight:900;color:#a15e7c;animation:evoPop .5s ease}
.evo-popup small{font-size:14px;display:block}
.evo-confetti{position:absolute;top:-30px;font-size:25px;animation:evoFall 2.3s linear forwards}
@keyframes evoPop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes evoFall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}
@media(prefers-reduced-motion:reduce){.food-fly,.evo-popup,.evo-confetti{animation:none!important}}

/* 2026-10-16：手機頂欄三欄布局，選單不再遮住登出 */
.site-header{display:grid;grid-template-columns:54px minmax(0,1fr) 54px;align-items:center;gap:8px;position:relative;padding:8px 0 12px;min-height:76px}
.site-brand{grid-column:2;text-align:center;min-width:0}
.site-brand h1{font-size:clamp(21px,5.2vw,31px);white-space:nowrap;margin:0}
.site-brand .muted{font-size:11px;line-height:1.4}
.site-header .menu-toggle{grid-column:1;grid-row:1;position:static;z-index:1;min-width:44px;width:48px;height:48px;padding:0;display:grid;place-items:center;font-size:23px;box-shadow:none}
.site-header #logout{grid-column:3;grid-row:1;min-width:0;width:54px;padding:9px 2px;min-height:44px;font-size:13px;white-space:nowrap;z-index:1}
.site-header .menu-toggle.hide{display:none!important}
@media(max-width:360px){.site-brand .muted{font-size:10px}.site-brand h1{font-size:20px}}
/* 日記心情：大顆愛心、五等分觸控區、清楚的選取狀態 */
.mood-section{background:#fff8f6;border:1px solid #f7e4e5;border-radius:22px;padding:17px 10px;margin:5px 0}
.mood-section>strong{display:block;text-align:center;color:#795b62;font-size:18px}
.mood-section>p{text-align:center;font-size:12px;margin:6px 0 13px}
.diary-moods{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px;max-width:520px;margin:auto}
.diary-moods .mood-option{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:5px;position:relative;min-width:0;padding:4px 0 7px;border:0;background:transparent;border-radius:15px;cursor:pointer}
.mood-option input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.mood-art{width:min(100%,76px);aspect-ratio:1;display:grid;place-items:center;position:relative;transition:transform .18s ease,filter .18s ease;filter:drop-shadow(0 3px 0 #d59b9b33)}
.mood-art svg{position:absolute;inset:0;width:100%;height:100%}
.mood-face{position:relative;z-index:1;color:#4b2529;font-size:clamp(18px,5vw,27px);font-weight:900;margin-top:7px;line-height:1}
.mood-label{font-size:12px;color:#856c6f;font-weight:700;white-space:nowrap}
.mood-option:has(input:checked){background:#fff0f2;box-shadow:inset 0 0 0 2px #e8a1b5}
.mood-option:has(input:checked) .mood-art{transform:translateY(-5px) scale(1.10);filter:drop-shadow(0 5px 0 #d59b9b55)}
.mood-option:focus-within{outline:3px solid #ad7695;outline-offset:2px}
@media(max-width:390px){.mood-label{font-size:11px}.mood-section{padding:14px 7px}}
@media(prefers-reduced-motion:reduce){.mood-art{transition:none!important}}

/* 成績管理：手機優先的上下排列 */
.grade-section{background:#FFFCF9;border:1px solid #F0DEE4;border-radius:20px;padding:16px;margin:15px 0;box-shadow:0 4px 14px #9b677012}
.grade-section h3{color:#7E5266;margin:4px 0 12px}
.grade-chart-scroll{width:100%;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;background:#FFF7F8;border-radius:15px;padding:8px 2px}
.grade-chart-scroll svg{display:block;max-width:none}
.grade-chart-scroll [data-grade-point]{cursor:pointer;outline-offset:2px}
.grade-chart-scroll [data-grade-point]:focus{outline:2px solid #B9688B}
.grade-point-detail{background:#F9E6EC;color:#784F61;border-radius:13px;padding:12px 14px;margin-top:12px;line-height:1.7;overflow-wrap:anywhere}
.grade-legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin:8px 0 12px}.grade-legend-item{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:#775C67}.grade-legend-item i{display:inline-block;width:12px;height:12px;border-radius:50%}.grade-section .item{background:white}
@media(max-width:600px){.grade-section{padding:12px}.grade-section .formgrid{grid-template-columns:1fr}}

.notice-body{white-space:pre-wrap;line-height:1.8;overflow-wrap:anywhere}
.notice-pinned{border-color:#e5b7c4;background:#fff8f9}
.notice-home{margin:20px 0}

/* 課前測驗：延續學習角落奶油粉色系 */
.quiz-play{background:#fffdf9;border:1px solid #f2dfd4;border-radius:20px;padding:clamp(18px,4vw,28px);margin-top:16px;box-shadow:0 5px 18px #d8b7a41a}
.quiz-play-head{display:flex;justify-content:space-between;gap:10px;color:#8a746d;font-size:14px;font-weight:700}
.quiz-progress{height:7px;background:#f8eae5;border-radius:30px;margin:12px 0 25px;overflow:hidden}
.quiz-progress>div{height:100%;background:#df969e;border-radius:30px;transition:width .2s}
.quiz-prompt{font-size:clamp(19px,3vw,24px);line-height:1.7;color:#594c49;margin:0 0 22px;white-space:pre-wrap}
.quiz-choices{display:grid;gap:11px;margin-bottom:16px}
.quiz-choice{display:flex!important;align-items:center;text-align:left!important;gap:14px;width:100%;padding:15px 16px!important;background:#fffaf6!important;color:#594c49!important;border:1.5px solid #ead9d0!important;border-radius:14px!important;font-size:16px;line-height:1.5;cursor:pointer;box-shadow:none!important}
.quiz-choice:not(:disabled):hover{background:#fff0eb!important;border-color:#dfabb0!important}

.quiz-letter{display:inline-flex;align-items:center;justify-content:center;flex:none;width:35px;height:35px;border-radius:11px;background:#f7e9e4;color:#8b6665;font-weight:800}
.quiz-choice.quiz-correct{background:#eaf7ed!important;border-color:#9acfa9!important;color:#316d46!important}
.quiz-choice.quiz-wrong{background:#fff0ef!important;border-color:#e9a7a5!important;color:#a14d4c!important}
.quiz-feedback{border-radius:14px;padding:16px 18px;margin:16px 0;line-height:1.65}

.quiz-feedback-bad{background:#fff0ef;color:#9b5350}
.quiz-score{font-size:27px;font-weight:800;color:#d1848d}
.quiz-review{border-top:1px solid #f0e4dc;padding:16px 0;line-height:1.6}
.quiz-review p{margin:6px 0;white-space:pre-wrap}
.quiz-good-text{color:#468458}.quiz-bad-text{color:#bd6663}

/* 首頁雙角色儀表板｜延續原本奶油粉色系 */
.home-welcome{display:flex;position:relative;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(120deg,#fff0db,#fff5ed 65%,#ffe6ed);border:2px solid #f2dfc7;border-radius:23px;padding:20px;margin-bottom:14px}

<body>
<div class="shell">
<header class="site-header">
  <button id="menuToggle" class="menu-toggle hide" type="button" aria-controls="tabs" aria-expanded="false" aria-label="開啟功能選單">☰</button>
  <div class="site-brand">
    <h1>🌷 學習角落</h1>
    <div class="muted">一起慢慢學，一起閃閃發光 ✨</div>
  </div>
  <button id="logout" class="secondary hide">登出</button>
</header>

<section id="login" class="panel">
  <h2>帳號登入</h2>
  <div class="actions">
    <button id="studentMode">學生登入</button>
    <button id="teacherMode" class="secondary">老師登入</button>
  </div>
  <form id="loginForm" class="formgrid" style="margin-top:15px">
    <label>
      <span id="accountLabel">英文帳號</span>
      <input name="account" required autocomplete="username">
    </label>
    <label>
      密碼
      <input name="password" type="password" required autocomplete="current-password">
    </label>
    <button type="submit">登入</button>
  </form>
</section>

<div id="app" class="hide">
  <section class="panel">
    <div class="top">
      <div>
        <h2 id="welcome"></h2>
        <p id="roleInfo" class="muted"></p>
      </div>
      <label id="studentPickerWrap" class="hide">
        目前查看學生
        <select id="studentPicker"></select>
      </label>
    </div>
    <div id="stats" class="grid"></div>
  </section>

  <div id="navShade" class="nav-shade" hidden></div>
  <nav id="tabs" class="tabs" aria-label="功能導覽"></nav>
  <section id="content" class="panel"></section>
  <div class="bottom-note">🌼 每天進步一點點，就是很棒的成長！</div>
</div>

<p id="message" role="status"></p>
</div>

<script type="module">
import {firebaseConfig} from "./firebase-config.js";

import {
  getSubjects,getSemesters,getChapters,getSections
} from "./curriculum.js";

import {initializeApp} from
"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {
  getAuth,onAuthStateChanged,
  signInWithEmailAndPassword,signOut,createUserWithEmailAndPassword
} from
"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

import {
  getFirestore,doc,getDoc,collection,query,where,
  getDocs,addDoc,updateDoc,deleteDoc,serverTimestamp,setDoc,runTransaction,arrayUnion
} from
"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import {getFunctions,httpsCallable} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-functions.js";

const firebaseApp=initializeApp(firebaseConfig);
const auth=getAuth(firebaseApp);
// 使用獨立 Firebase App 建立學生，避免老師被登出
const studentCreationApp=initializeApp(firebaseConfig,"student-creation");
const studentCreationAuth=getAuth(studentCreationApp);
const db=getFirestore(firebaseApp);
const functions=getFunctions(firebaseApp,"asia-east1");
const deleteStudentAccount=httpsCallable(functions,"deleteStudentAccount");
// Spark 免費方案：學生端獨立抽獎，不使用 Cloud Functions
const $=s=>document.querySelector(s);

const schedule={
  3:"理化",
  4:"數學",
  6:"生物"
};

const names={
  home:"今日課程",
  announcements:"公告欄",
  quizzes:"課前小測驗",
  progress:"課程進度",
  homework:"作業管理",
  grades:"成績管理",
  materials:"教材中心",
  mistakes:"錯題追蹤",
  attendance:"出席紀錄",
  students:"學生管理",
  pet:"我的小寵物",
  diary:"心情日記"
};

const fields={
  progress:[
    ["date","上課日期","date"],
    ["detail","上課內容","textarea"],
    ["completion","完成進度（0～100）","number"],
    ["next","下次進度"]
  ],
  grades:[
    ["date","考試日期","date"],
    ["score","得分（滿分 100）","number"],
    ["detail","老師評語","textarea"]
  ],
  materials:[
    ["date","上架日期","date"],
    ["url","教材連結","url"],
    ["detail","說明","textarea"]
  ],
  mistakes:[
    ["date","紀錄日期","date"],
    ["detail","錯誤原因","textarea"],
    ["advice","訂正建議","textarea"]
  ]
};

const statusNames={
  unchecked:"未批改",
  done:"已完成",
  correct:"需要訂正",
  missing:"未寫"
};

const attendanceNames={
  present:"出席",
  leave:"請假"
};

let me=null;
let profile=null;
let students=[];
let allStudentProfiles=[];
let selected="";
let tab="home";
let cache={};
let loginMode="student";
let homeworkFilter="all";
let initialForm=null;
let petData=null;
let diaryEntries=[];
let formRecipients=[];
let announcements=[];
let quizzes=[];
let quizSubmissions=[];

function esc(value){
  return String(value??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",
    '"':"&quot;","'":"&#39;"
  }[c]));
}

function msg(text,error=false){
  $("#message").textContent=text;
  $("#message").className=error?"error":"success";
}

function isAdmin(){
  return profile?.role==="teacher";
}

function activeUid(){
  return isAdmin()?selected:me?.uid;
}

function localDate(d=new Date()){
  return [
    d.getFullYear(),
    String(d.getMonth()+1).padStart(2,"0"),
    String(d.getDate()).padStart(2,"0")
  ].join("-");
}

function today(){
  return localDate();
}

function todaySubject(){
  return schedule[new Date().getDay()]||"";
}

function dayName(d){
  return ["日","一","二","三","四","五","六"][d.getDay()];
}

function dateDay(date){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date||""))return "";
  const d=new Date(date+"T12:00:00");
  return dayName(d);
}

function getStatus(x){
  if(["unchecked","done","correct","missing"].includes(x.status)){
    return x.status;
  }
  return x.done===true?"done":"unchecked";
}

function attendanceStatus(x){
  return x?.status==="present"||x?.status==="leave"
    ?x.status:"";
}

function dateSubject(date){
  if(!date)return "";
  const d=new Date(date+"T12:00:00");
  return schedule[d.getDay()]||"";
}

function attendanceKey(uid,date,subject){
  return [uid,date,subject].join("_");
}

/* ========= Firestore ========= */

async function load(kind){
  const snap=await getDocs(query(
    collection(db,kind),
    where("studentId","==",activeUid())
  ));

  return snap.docs.map(d=>({
    id:d.id,...d.data()
  })).sort((a,b)=>
    (b.date||"").localeCompare(a.date||"")
  );
}

async function reload(){
  try{
    cache={};
    petData=null;
    diaryEntries=[];

    if(!activeUid()){
      render();
      return;
    }

    for(const kind of [
      "progress","homework","grades",
      "materials","mistakes","attendance"
    ]){
      cache[kind]=await load(kind);
    }

    await loadExtras();
    await loadAnnouncements();
    await loadQuizzes();
    render();
  }catch(error){
    msg("資料讀取失敗："+error.message,true);
  }
}

/* ========= 課程選擇器 ========= */

function curriculumSelectorHTML(existing={}){
  const subject=existing.subject||todaySubject()||"數學";

  return `
    <div class="curriculum-box full">
      <h3>📚 選擇科目與章節</h3>

      <div class="formgrid">
        <label>
          科目
          <select id="currSubject" name="subject">
            ${getSubjects().map(s=>`
              <option value="${esc(s)}"
                ${s===subject?"selected":""}>
                ${esc(s)}
              </option>
            `).join("")}
          </select>
        </label>

        <label>
          年級／學期
          <select id="currSemester" name="semester"></select>
        </label>

        <label class="full">
          章節
          <select id="currChapter" name="chapter"></select>
        </label>
      </div>

      <div style="margin-top:14px">
        <div class="top">
          <strong>小節（可複選）</strong>
          <button type="button" class="secondary"
            id="selectAllSections">
            全選／取消全選
          </button>
        </div>
        <div id="currSections" class="section-list"></div>
      </div>
    </div>
  `;
}

function setupCurriculumSelector(existing={}){
  const subjectEl=$("#currSubject");
  const semesterEl=$("#currSemester");
  const chapterEl=$("#currChapter");
  const sectionsEl=$("#currSections");

  if(!subjectEl)return;

  const initialSections=Array.isArray(existing.sections)
    ?existing.sections:[];

  function fillSections(selectedSections=[]){
    const sections=getSections(
      subjectEl.value,
      semesterEl.value,
      chapterEl.value
    );

    sectionsEl.innerHTML=sections.length
      ?sections.map(s=>`
        <label class="section-check">
          <input type="checkbox" name="sections"
            value="${esc(s)}"
            ${selectedSections.includes(s)?"checked":""}>
          <span>${esc(s)}</span>
        </label>
      `).join("")
      :'<p class="muted">此科目尚無小節，可自行輸入名稱。</p>';
  }

  function fillChapters(preferred="",sections=[]){
    const chapters=getChapters(
      subjectEl.value,semesterEl.value
    );

    chapterEl.innerHTML=chapters.map(c=>`
      <option value="${esc(c)}">${esc(c)}</option>
    `).join("");

    if(chapters.includes(preferred)){
      chapterEl.value=preferred;
    }

    fillSections(sections);
  }

  function fillSemesters(preferred="",chapter="",sections=[]){
    const semesters=getSemesters(subjectEl.value);

    semesterEl.innerHTML=semesters.map(s=>`
      <option value="${esc(s)}">${esc(s)}</option>
    `).join("");

    if(semesters.includes(preferred)){
      semesterEl.value=preferred;
    }

    fillChapters(chapter,sections);
  }

  subjectEl.onchange=()=>{
    fillSemesters();
    autoFillTitle();
  };

  semesterEl.onchange=()=>{
    fillChapters();
    autoFillTitle();
  };

  chapterEl.onchange=()=>{
    fillSections();
    autoFillTitle();
  };

  sectionsEl.onchange=autoFillTitle;

  $("#selectAllSections").onclick=()=>{
    const boxes=[...sectionsEl.querySelectorAll(
      'input[type="checkbox"]'
    )];

    const check=boxes.some(x=>!x.checked);
    boxes.forEach(x=>x.checked=check);
    autoFillTitle();
  };

  fillSemesters(
    existing.semester||"",
    existing.chapter||"",
    initialSections
  );
}

function selectedCurriculum(){
  return {
    subject:$("#currSubject")?.value||"其他",
    semester:$("#currSemester")?.value||"",
    chapter:$("#currChapter")?.value||"",
    sections:[...document.querySelectorAll(
      '#currSections input[name="sections"]:checked'
    )].map(x=>x.value)
  };
}

function curriculumTitle(data){
  return data.sections.length
    ?data.sections.join("、")
    :data.chapter||"";
}

function autoFillTitle(){
  const title=$("#recordTitle");
  if(!title||title.dataset.manual==="true")return;
  title.value=curriculumTitle(selectedCurriculum());
}

function bindTitleTracking(existing){
  const title=$("#recordTitle");
  if(!title)return;

  if(existing)title.dataset.manual="true";
  title.oninput=()=>title.dataset.manual="true";

  if(!existing)autoFillTitle();
}

function curriculumDisplay(x){
  const parts=[
    x.semester,
    x.chapter,
    ...(Array.isArray(x.sections)?x.sections:[])
  ].filter(Boolean);

  return parts.length
    ?`<p class="muted">📖 ${parts.map(esc).join("／")}</p>`
    :"";
}

/* ========= 多學生選擇 ========= */

function recipientSelectorHTML(existing=null){
  if(!isAdmin()||existing)return "";

  const defaults=formRecipients.length
    ?formRecipients
    :(selected?[selected]:[]);

  return `
    <div class="curriculum-box full">
      <div class="top">
        <strong>👥 指派學生（可複選）</strong>
        <button type="button" class="secondary"
          id="toggleAllStudents">
          全選／取消全選
        </button>
      </div>

      <div class="student-list" id="recipientList">
        ${students.map(s=>`
          <label class="student-check">
            <input type="checkbox" name="recipient"
              value="${esc(s.uid)}"
              ${defaults.includes(s.uid)?"checked":""}>
            ${esc(s.name||s.uid)}
          </label>
        `).join("")}
      </div>

      <p class="muted">
        同時新增給多位學生後，每位學生的紀錄仍可個別編輯。
      </p>
    </div>
  `;
}

function setupRecipients(){
  const btn=$("#toggleAllStudents");
  if(!btn)return;

  btn.onclick=()=>{
    const boxes=[...document.querySelectorAll(
      '#recipientList input[type="checkbox"]'
    )];

    const check=boxes.some(x=>!x.checked);
    boxes.forEach(x=>x.checked=check);
  };
}

function selectedRecipients(existing){
  if(existing)return [existing.studentId||selected];

  return [...document.querySelectorAll(
    '#recipientList input[name="recipient"]:checked'
  )].map(x=>x.value);
}

async function saveMultiple(kind,data,existing,recipients){
  if(existing){
    await updateDoc(doc(db,kind,existing.id),data);
    return 1;
  }

  if(!recipients.length){
    throw new Error("請至少選擇一位學生");
  }

  for(const studentId of recipients){
    await addDoc(collection(db,kind),{
      ...data,
      studentId,
      createdAt:serverTimestamp()
    });
  }

  return recipients.length;
}

/* ========= 主畫面 ========= */

function render(){
  const works=cache.homework||[];
  const records=cache.progress||[];

  $("#stats").innerHTML=[
    ["課程紀錄",records.length],
    ["需要訂正",works.filter(
      x=>getStatus(x)==="correct"
    ).length],
    ["未寫作業",works.filter(
      x=>getStatus(x)==="missing"
    ).length]
  ].map(([label,value])=>`
    <div class="stat">
      <span>${esc(label)}</span>
      <strong>${esc(value)}</strong>
    </div>
  `).join("");

  $("#tabs").innerHTML=Object.entries(names).filter(([key])=>key!=="students"||isAdmin()).map(
    ([key,label])=>`
      <button data-tab="${key}"
        class="${tab===key?"active":""}">
        ${({home:"🏠",announcements:"📢",progress:"📖",homework:"📝",grades:"📊",materials:"📚",mistakes:"🔍",attendance:"📅",students:"👩‍🏫",pet:"🐣",diary:"💌",quizzes:"🧪"})[key]} ${label}
      </button>
    `
  ).join("");

  $("#tabs").querySelectorAll("[data-tab]").forEach(b=>{
    b.onclick=()=>{
      tab=b.dataset.tab;
      closeMenu();
      render();
    };
  });

  if(tab==="announcements"){renderAnnouncements();return;}
  if(tab==="quizzes"){renderQuizzes();return;}
  if(tab==="pet"){renderPet();return;}
  if(tab==="diary"){renderDiary();return;}
  if(tab==="students"&&isAdmin()){
    renderStudentManagement();
    return;
  }

  if(!activeUid()){
    $("#content").innerHTML=
      '<div class="empty">請先選擇學生</div>';
    return;
  }

  if(tab==="home")renderHome();
  else if(tab==="homework")renderHomework();
  else if(tab==="grades")renderGrades();
  else if(tab==="attendance")renderAttendance();
  else renderStandard();
}


/* 側邊選單 */
function closeMenu(){const nav=$("#tabs");nav.classList.remove("open");$("#navShade").hidden=true;$("#menuToggle").setAttribute("aria-expanded","false");}
$("#menuToggle").onclick=()=>{const opened=$("#tabs").classList.toggle("open");$("#navShade").hidden=!opened;$("#menuToggle").setAttribute("aria-expanded",String(opened));};
$("#navShade").onclick=closeMenu;
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeMenu();});
/* 餵食音效：瀏覽器原生 Web Audio，不需額外音檔 */
function playFeedSound(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const ctx=new AC();[523,659,784,1047].forEach((hz,i)=>{const osc=ctx.createOscillator(),gain=ctx.createGain(),at=ctx.currentTime+i*.10;osc.type="sine";osc.frequency.setValueAtTime(hz,at);gain.gain.setValueAtTime(.0001,at);gain.gain.exponentialRampToValueAtTime(.13,at+.015);gain.gain.exponentialRampToValueAtTime(.0001,at+.18);osc.connect(gain).connect(ctx.destination);osc.start(at);osc.stop(at+.2);});setTimeout(()=>ctx.close().catch(()=>{}),1100);}catch(e){console.debug("音效不可用",e);}}
/* ========= 寵物養成、每週結算與進化禮物 ========= */
const PET_FOODS=["🥕","🍎","🍪","🍓"];
const PET_CHOICES=["🐱","🐶","🐰","🐼","🐷","🐻","🐹","🐧","🦊","🐸","🐨","🦄"];
const PRIZES=["🧋 50 元飲料券","💵 100 元現金券","📚 作業減免券"];
const PRIZE_KEYS=["drink50","cash100","homeworkPass"];
const EVO_MAX=20;
const milestone=n=>5*n*n+45*n; // 50, 110, 180, 260, 350 ...
const stageCount=x=>Math.max(0,Number(x?.evolutions||0));
const petLevel=x=>stageCount(x)+1;
const petAvatar=x=>PET_CHOICES.includes(x?.emoji)?x.emoji:"🐱";
const defaultPet=()=>({name:"小豆",emoji:"🐱",xp:0,evolutions:0,fedIds:[],drawn:0,pendingBox:-1,bag:{drink50:0,cash100:0,homeworkPass:0},redeemed:{drink50:0,cash100:0,homeworkPass:0}});
const evolutionFrom=(xp,previous=0)=>{let n=previous;while(n<EVO_MAX&&xp>=milestone(n+1))n++;return n;};
const petNext=(x)=>milestone(stageCount(x)+1);
const remainingDraws=p=>Math.max(0,stageCount(p)-Number(p.drawn||0));
function playEvolveSound(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C();[523,659,784,1047,1319].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+i*.13;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.13,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.22);o.connect(g).connect(c.destination);o.start(t);o.stop(t+.23)});setTimeout(()=>c.close(),1600)}catch(e){}}
function evolutionCelebration(){playEvolveSound();const box=document.createElement('div');box.className='evo-overlay';box.innerHTML='<div class="evo-popup">🎊 進化成功！<div style="font-size:86px">'+petAvatar(petData)+'</div><small>寵物變大了！解鎖一次禮物盒抽獎 🎁</small></div>';document.body.append(box);for(let i=0;i<38;i++){const c=document.createElement('span');c.className='evo-confetti';c.textContent=['🌟','💗','🎉','✨','🌸'][i%5];c.style.left=Math.random()*100+'%';c.style.animationDelay=Math.random()*.5+'s';box.append(c)}setTimeout(()=>box.remove(),2400)}
function feedCelebration(food='🍎',evolved=false){playFeedSound();const pet=$('.pet-emoji'),stage=$('.pet-stage');pet?.classList.add('celebrate');stage?.classList.add('sparkle');if(stage){const flying=document.createElement('span');flying.className='food-fly';flying.textContent=food;stage.append(flying);setTimeout(()=>flying.remove(),1100)}const fx=document.createElement('div');fx.className='feed-fx';document.body.append(fx);['💖','✨','⭐','🍓','💛','🌸','✨','🎉'].forEach((icon,i)=>{const span=document.createElement('span');span.textContent=icon;const angle=i*Math.PI*2/8;span.style.setProperty('--dx',Math.round(Math.cos(angle)*130)+'px');span.style.setProperty('--dy',Math.round(Math.sin(angle)*155)+'px');fx.append(span)});setTimeout(()=>{fx.remove();pet?.classList.remove('celebrate');stage?.classList.remove('sparkle')},1400);if(evolved)setTimeout(evolutionCelebration,850)}
async function loadExtras(){const uid=activeUid();if(!uid)return;const snap=await getDoc(doc(db,'pets',uid));petData=snap.exists()?{...defaultPet(),...snap.data()}:defaultPet();const diarySnap=await getDocs(query(collection(db,'diaries'),where('studentId','==',uid)));diaryEntries=diarySnap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.date||'').localeCompare(a.date||''))}

const quizStudentName=id=>allStudentProfiles.find(x=>x.uid===id)?.name||id;
async function loadQuizzes(){
  if(!me)return;
  const q=isAdmin()?collection(db,'quizzes'):query(collection(db,'quizzes'),where('targetIds','array-contains',me.uid),where('released','==',true));
  const snap=await getDocs(q);
  quizzes=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
  const submissions=await getDocs(isAdmin()?collection(db,'quizSubmissions'):query(collection(db,'quizSubmissions'),where('studentId','==',me.uid)));
  quizSubmissions=submissions.docs.map(d=>({id:d.id,...d.data()}));
}
function quizResult(q,uid){return quizSubmissions.find(x=>x.quizId===q.id&&x.studentId===uid)}
function renderQuizzes(){
  $('#content').innerHTML=`<div class="top"><h2>🧪 課前小測驗</h2>${isAdmin()?'<button id="createQuiz">＋建立測驗</button>':''}</div><p class="muted">${isAdmin()?'可先建立所有題庫並保存；上課前再按「開放測驗」，學生才看得到。':'每次只顯示一題，選擇答案後立即顯示正解與解析，再按下一題。'}</p><div id="quizEditor"></div>${quizzes.length?quizzes.map(q=>{
  const mine=!isAdmin()?quizResult(q,me.uid):null;
  const count=quizSubmissions.filter(x=>x.quizId===q.id).length;
  return `<article class="item"><div class="top"><h3>${esc(q.title)}</h3><span class="pill">${(q.questions||[]).length} 題 · ${q.released===true?"🟢 開放中":"🔒 題庫待開放"}</span></div><p class="muted">${esc(q.subject||'理化')} · ${isAdmin()?`已完成 ${count}/${(q.targetIds||[]).length} 人`:(mine?'✓ 已完成':'尚未作答')}</p><div class="actions">${isAdmin()?`<button data-results="${q.id}" class="secondary">查看成績</button><button data-toggle-quiz="${q.id}" class="secondary">${q.released===true?"🔒 關閉測驗":"🟢 開放測驗"}</button><button data-remove-quiz="${q.id}" class="danger">刪除</button>`:mine?`<button data-myquiz="${q.id}" class="secondary">查看我的結果</button>`:`<button data-takequiz="${q.id}">開始作答</button>`}</div><div id="quiz-detail-${q.id}"></div></article>`;
}).join(''):'<div class="empty">目前沒有測驗 🌷</div>'}`;
  $('#createQuiz')?.addEventListener('click',showQuizEditor);
  document.querySelectorAll('[data-takequiz]').forEach(b=>b.onclick=()=>showQuizTake(quizzes.find(q=>q.id===b.dataset.takequiz)));
  document.querySelectorAll('[data-myquiz]').forEach(b=>b.onclick=()=>showQuizMy(quizzes.find(q=>q.id===b.dataset.myquiz)));
  document.querySelectorAll('[data-results]').forEach(b=>b.onclick=()=>showQuizResults(quizzes.find(q=>q.id===b.dataset.results)));
  document.querySelectorAll('[data-toggle-quiz]').forEach(b=>b.onclick=async()=>{
    const q=quizzes.find(x=>x.id===b.dataset.toggleQuiz);if(!q)return;
    const next=q.released!==true;
    if(!confirm(next?`確定開放「${q.title}」給指定學生作答？`:`確定關閉「${q.title}」？已提交成績不會刪除。`))return;

function parseQuizCSV(text){
  text=String(text).replace(/^\uFEFF/,'');
  const rows=[];let row=[],cell='',quoted=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else quoted=!quoted}
    else if(c===','&&!quoted){row.push(cell);cell=''}
    else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell=''}
    else cell+=c;
  }
  if(quoted)throw Error('CSV 引號沒有正確結束');
  row.push(cell);if(row.some(x=>x.trim()))rows.push(row);
  if(rows.length<2)throw Error('題庫至少需要標題列與一題');
  const headers=rows.shift().map(x=>x.trim().replace(/^\uFEFF/,''));
  const required=['題目','A','B','C','D','答案','詳解'];
  if(required.some(h=>!headers.includes(h)))throw Error('欄位必須包含：'+required.join('、'));
  const col=h=>headers.indexOf(h);
  return rows.map((r,i)=>{
    const value=h=>String(r[col(h)]||'').trim();
    const answer=value('答案').toUpperCase();
    const options=['A','B','C','D'].map(value);
    const points=headers.includes('配分')?Number(value('配分')||10):10;
    if(!value('題目')||options.some(x=>!x)||!value('詳解')||!['A','B','C','D'].includes(answer))throw Error(`第 ${i+2} 列有空白欄位或答案不是 A～D`);
    if(!Number.isFinite(points)||points<=0||points>100)throw Error(`第 ${i+2} 列配分需介於 1～100`);
    if(value('題目').length>1000||options.some(x=>x.length>300)||value('詳解').length>1500)throw Error(`第 ${i+2} 列文字過長`);
    return {chapter:headers.includes('章節')?value('章節'):'',text:value('題目'),options,correct:'ABCD'.indexOf(answer),explanation:value('詳解'),points};
  });
}

async function claimQuizXp(quizId){
 return await runTransaction(db,async tx=>{
  const submissionRef=doc(db,'quizSubmissions',quizId+'_'+me.uid);
  const petRef=doc(db,'pets',me.uid);
  const [submission,petSnap]=await Promise.all([tx.get(submissionRef),tx.get(petRef)]);
  if(!submission.exists() || submission.data().studentId!==me.uid || submission.data().quizId!==quizId)throw Error('找不到這份測驗的完成紀錄');
  if(!petSnap.exists())throw Error('請先到寵物頁面建立並儲存寵物，再回來領取 XP');
  const pet={...defaultPet(),...petSnap.data()};
  if((pet.quizRewardIds||[]).includes(quizId))return {earned:false,xp:Number(pet.xp||0)};
  const xp=Number(pet.xp||0)+3;
  tx.update(petRef,{xp,evolutions:evolutionFrom(xp,pet.evolutions||0),quizRewardIds:[...(pet.quizRewardIds||[]),quizId]});
  return {earned:true,xp};
 });
}

}

function renderHomework(){
  const works=cache.homework||[];
  const dates=[...new Set(
    works.map(x=>x.date).filter(Boolean)
  )].sort((a,b)=>b.localeCompare(a));

  const shown=homeworkFilter==="all"
    ?works
    :works.filter(x=>x.date===homeworkFilter);

  const groups={};

  for(const work of shown){
    const d=work.date||"未設定日期";
    (groups[d]??=[]).push(work);
  }

  $("#content").innerHTML=`
    <div class="top">
      <div>
        <h2>作業管理</h2>
        <p class="muted">
          ${isAdmin()
            ?"可以一次指派多位學生，之後個別批改。"
            :"查看每天的作業與批改結果。"}
        </p>
      </div>
      ${isAdmin()
        ?'<button id="addHomework">＋新增作業</button>'
        :""}
    </div>

    <div class="filterbar">
      <label>
        查看日期
        <select id="homeworkFilter">
          <option value="all">全部日期</option>
          ${dates.map(d=>`
            <option value="${esc(d)}"
              ${homeworkFilter===d?"selected":""}>
              ${esc(d)}
            </option>
          `).join("")}
        </select>
      </label>
    </div>

    <div id="homeworkList">
      ${Object.keys(groups).length
        ?Object.keys(groups).sort((a,b)=>b.localeCompare(a))
          .map(date=>`
            <section class="hw-day">
              <div class="day-head">
                📅 ${esc(date)}（${groups[date].length} 項）
              </div>
              <div class="hw-body">
                ${groups[date].map((x,i)=>
                  homeworkRow(x,i)
                ).join("")}
              </div>
            </section>
          `).join("")
        :'<div class="empty">目前沒有作業</div>'}
    </div>
  `;

  if(isAdmin()){
    $("#addHomework").onclick=()=>{
      formRecipients=[];
      editHomework();
    };

    $("#homeworkList").querySelectorAll(
      "[data-edit-hw]"
    ).forEach(b=>{
      b.onclick=()=>editHomework(
        works.find(x=>x.id===b.dataset.editHw)
      );
    });

    $("#homeworkList").querySelectorAll(
      "[data-delete-hw]"
    ).forEach(b=>{
      b.onclick=()=>remove("homework",b.dataset.deleteHw);
    });

    $("#homeworkList").querySelectorAll(
      "[data-status]"
    ).forEach(s=>{
      s.onchange=async()=>{
        const x=works.find(r=>r.id===s.dataset.status);
        if(!x)return;

        s.disabled=true;

        try{
          await updateDoc(doc(db,"homework",x.id),{
            status:s.value,
            done:s.value==="done"
          });
          msg("已更新作業狀態");
          await reload();
        }catch(error){
          s.disabled=false;
          msg("更新失敗："+error.message,true);
          await reload();
        }
      };
    });
  }

  $("#homeworkFilter").onchange=e=>{
    homeworkFilter=e.target.value;
    renderHomework();
  };
}

function homeworkRow(x,i){
  const status=getStatus(x);
  const due=x.date&&/^\d{4}-\d{2}-\d{2}$/.test(x.date)?(()=>{const d=new Date(x.date+'T12:00:00');d.setDate(d.getDate()+7);return localDate(d)})():'';

  return `
    <div class="hw-row">
      <div class="hw-info">
        <span class="pill">${esc(x.subject||"未分類")}</span>
        <h3>${i+1}. ${esc(x.title)}</h3>
        ${due?`<p class="muted">📅 指派：${esc(x.date)} ・ 一週後檢查：${esc(due)}</p>`:""}
        ${curriculumDisplay(x)}
        ${x.detail?`<p>${esc(x.detail)}</p>`:""}
        ${x.advice?`
          <p><strong>老師提醒：</strong>${esc(x.advice)}</p>
        `:""}
      </div>

      ${isAdmin()?`
        <div class="hw-controls">
          <label>
            批改結果
            <select data-status="${esc(x.id)}">
              ${Object.entries(statusNames).map(([key,label])=>`
                <option value="${key}"
                  ${status===key?"selected":""}>
                  ${label}
                </option>
              `).join("")}
            </select>
          </label>

          <div class="actions">
            <button class="secondary"
              data-edit-hw="${esc(x.id)}">編輯</button>
            <button class="danger"
              data-delete-hw="${esc(x.id)}">刪除</button>
          </div>
        </div>
      `:`
        <span class="status ${status}">
          ${statusNames[status]}
        </span>
      `}
    </div>
  `;
}

        <input id="recordTitle" name="title" required
          value="${esc(existing?.title||"")}"
          placeholder="選擇小節後自動帶入">

      <label class="full">
        作業說明
        <textarea name="detail">${esc(existing?.detail||"")}</textarea>
      </label>

      <label class="full">

    const status=String(f.get("status"));

function editStandard(kind,existing=null,defaults={},mount="#content"){
  const preset={
    ...defaults,
    ...(existing||{})
  };

  const formHTML=fields[kind].map(
    ([key,label,type="text"])=>{
      let control;

      if(type==="textarea"){
        control=`
          <textarea name="${key}">${esc(
            existing?.[key]||""
          )}</textarea>
        `;
      }else{
        const value=existing?.[key]??
          (type==="date"
            ?preset.date||today()
            :"");

        control=`
          <input name="${key}" type="${type}"
            value="${esc(value)}"
            ${key==="date"?"required":""}
            ${type==="number"
              ?'min="0" max="100" step="any"':""}>
        `;
      }

      return `
        <label class="${type==="textarea"?"full":""}">
          ${label}
          ${control}
        </label>
      `;
    }
  ).join("");

  $(mount).innerHTML=`
    <h2>${existing?"編輯":"新增"}${kind==="grades"?"考試成績":names[kind]}</h2>

    <form id="entryForm" class="formgrid">
      ${recipientSelectorHTML(existing)}
      ${curriculumSelectorHTML(preset)}

      <label class="full">
        名稱／主題
        <input id="recordTitle" name="title" required
          value="${esc(existing?.title||"")}"
          placeholder="選擇章節後自動帶入">
      </label>

      ${formHTML}

      ${kind==="grades"?`
        <div class="full">
          <span class="pill">滿分固定：100 分</span>
        </div>
      `:""}

      <div class="actions full">
        <button type="submit">儲存</button>
        <button type="button" class="secondary"
          id="cancel">取消</button>
      </div>
    </form>
  `;

  setupRecipients();
  setupCurriculumSelector(preset);
  bindTitleTracking(existing);

  $("#cancel").onclick=()=>{if(mount!=="#content"){$(mount).classList.add("hide");}else render();};

  $("#entryForm").onsubmit=async e=>{
    e.preventDefault();

    const f=new FormData(e.target);
    const recipients=selectedRecipients(existing);

    if(!recipients.length){
      msg("請至少選擇一位學生",true);
      return;
    }

    const data={
      ...selectedCurriculum(),
      title:String(f.get("title")).trim()
    };

    for(const [key,,type] of fields[kind]){
      const value=String(f.get(key)||"");

      if(type==="number"){
        data[key]=Number(value);
      }else{
        data[key]=value.trim();
      }
    }

    if(kind==="grades"){
      if(!Number.isFinite(data.score)||
         data.score<0||data.score>100){
        msg("考試分數請填 0～100",true);
        return;
      }
      data.total=100;
    }

    if(kind==="progress"&&
       (data.completion<0||data.completion>100)){
      msg("完成進度請填 0～100",true);
      return;
    }

    if(kind==="materials"&&
       !/^https:\/\//i.test(data.url)){
      msg("教材連結請以 https:// 開頭",true);
      return;
    }

    const btn=e.target.querySelector('[type="submit"]');
    btn.disabled=true;

    try{
      const count=await saveMultiple(
        kind,data,existing,recipients
      );

      msg(`已儲存，共 ${count} 位學生`);
      formRecipients=[];
      tab=kind;
      await reload();
    }catch(error){
      btn.disabled=false;
      msg("儲存失敗："+error.message,true);
    }
  };
}

async function remove(kind,id){
  if(!confirm("確定刪除這筆紀錄？"))return;

  try{
    await deleteDoc(doc(db,kind,id));
    msg("已刪除");
    await reload();
  }catch(error){
    msg("刪除失敗："+error.message,true);
  }
}

            科目
            <select id="attendanceSubject">
              ${["數學","理化","生物","其他"].map(s=>`
                <option value="${s}"
                  ${s===currentSubject?"selected":""}>
                  ${s}
                </option>
              `).join("")}
            </select>
          </label>

          <label>
            狀態
            <select id="attendanceStatus">
              <option value="present">出席</option>
              <option value="leave">請假</option>
            </select>
          </label>

          <label>
            備註（選填）
            <input id="attendanceNote"
              placeholder="例如：事假">
          </label>
        </div>

        <h4>選擇學生（可複選）</h4>

        <div class="student-list" id="attendanceStudents">
          ${students.map(s=>`
            <label class="student-check">
              <input type="checkbox" value="${esc(s.uid)}"
                ${s.uid===selected?"checked":""}>
              ${esc(s.name||s.uid)}
            </label>
          `).join("")}
        </div>

        <div class="actions">
          <button id="attendanceSave">儲存出席紀錄</button>
          <button id="attendanceSelectAll"
            class="secondary">全選／取消全選</button>
        </div>
      </div>
    `:""}

    <h3>歷史紀錄</h3>

    <div id="attendanceHistory">
      ${arr.length?arr.map(x=>`
        <div class="item">
          <div class="top">
            <div>
              <strong>${esc(x.date)}</strong>
              <span class="pill">${esc(x.subject)}</span>
            </div>
            <span class="status ${esc(x.status)}">
              ${attendanceNames[x.status]||"未登記"}
            </span>
          </div>

          ${x.note?`<p>${esc(x.note)}</p>`:""}

          ${isAdmin()?`
            <div class="actions">
              <button class="secondary"
                data-edit-att="${esc(x.id)}">
                修改
              </button>
              <button class="danger"
                data-delete-att="${esc(x.id)}">
                刪除
              </button>
            </div>
          `:""}
        </div>
      `).join("")
      :'<div class="empty">尚無出席紀錄</div>'}
    </div>
  `;

  if(!isAdmin())return;

  $("#attendanceDate").onchange=e=>{
    const subject=dateSubject(e.target.value);
    if(subject){
      $("#attendanceSubject").value=subject;
    }
  };

  $("#attendanceSelectAll").onclick=()=>{
    const boxes=[...document.querySelectorAll(
      '#attendanceStudents input[type="checkbox"]'
    )];

    const check=boxes.some(x=>!x.checked);
    boxes.forEach(x=>x.checked=check);
  };

  $("#attendanceSave").onclick=async()=>{
    const date=$("#attendanceDate").value;
    const subject=$("#attendanceSubject").value;
    const status=$("#attendanceStatus").value;
    const note=$("#attendanceNote").value.trim();

    const ids=[...document.querySelectorAll(
      '#attendanceStudents input:checked'
    )].map(x=>x.value);

    if(!date||!ids.length){
      msg("請選擇日期及至少一位學生",true);
      return;
    }

    const btn=$("#attendanceSave");
    btn.disabled=true;

    try{
      for(const studentId of ids){
        const q=query(
          collection(db,"attendance"),
          where("studentId","==",studentId),
          where("date","==",date),
          where("subject","==",subject)
        );

        const snap=await getDocs(q);
        const data={studentId,date,subject,status,note};

        if(snap.empty){
          await addDoc(collection(db,"attendance"),{
            ...data,
            createdAt:serverTimestamp()
          });
        }else{
          for(const d of snap.docs){
            await updateDoc(
              doc(db,"attendance",d.id),data
            );
          }
        }
      }

      msg(`已登記 ${ids.length} 位學生`);
      await reload();
    }catch(error){
      btn.disabled=false;
      msg("出席紀錄儲存失敗："+error.message,true);
    }
  };

  $("#attendanceHistory").querySelectorAll(
    "[data-edit-att]"
  ).forEach(b=>{
    b.onclick=()=>{
      const x=arr.find(r=>r.id===b.dataset.editAtt);
      if(!x)return;

      $("#attendanceDate").value=x.date;
      $("#attendanceSubject").value=x.subject;
      $("#attendanceStatus").value=x.status;
      $("#attendanceNote").value=x.note||"";

      document.querySelectorAll(
        '#attendanceStudents input[type="checkbox"]'
      ).forEach(c=>{
        c.checked=c.value===x.studentId;
      });

      window.scrollTo({top:0,behavior:"smooth"});
    };
  });

  $("#attendanceHistory").querySelectorAll(
    "[data-delete-att]"
  ).forEach(b=>{
    b.onclick=()=>remove(
      "attendance",b.dataset.deleteAtt
    );
  });
}

/* ========= 成績管理：上方輸入、中間日期趨勢、下方紀錄 ========= */
function renderGrades(){
  const arr=[...(cache.grades||[])]
    .filter(x=>x.score!==undefined && Number.isFinite(Number(x.score)))
    .sort((a,b)=>(a.date||"").localeCompare(b.date||"") || (a.subject||"").localeCompare(b.subject||"") || (a.title||"").localeCompare(b.title||""));
  const subjects=[...new Set(arr.map(x=>String(x.subject||"未分類")))];
  const palette=["#D989A6","#679DD2","#72AA86","#C69B59","#9B83C9","#D98565","#699D9D"];
  const colorOf=subject=>palette[subjects.indexOf(subject)%palette.length];
  const dates=[...new Set(arr.map(x=>x.date||"未填日期"))];
  const w=Math.max(340,dates.length*86+78),left=46,right=22,top=24,bottom=218;
  const xAt=date=>left+(dates.length===1?(w-left-right)/2:dates.indexOf(date)*(w-left-right)/(dates.length-1));
  const yAt=value=>bottom-Math.max(0,Math.min(100,Number(value)))/100*(bottom-top);
  const bySubject=subjects.map(subject=>({subject,items:arr.filter(x=>String(x.subject||"未分類")===subject)}));
  const svg=arr.length?`<div class="grade-legend" aria-label="科目顏色說明">${subjects.map(sub=>`<span class="grade-legend-item"><i style="background:${colorOf(sub)}"></i>${esc(sub)}</span>`).join("")}</div>
    <div class="grade-chart-scroll"><svg width="${w}" height="264" viewBox="0 0 ${w} 264" role="img" aria-label="各科獨立成績折線圖，橫軸考試日期，縱軸分數，點選圓點查看考卷名稱">
    ${[0,25,50,75,100].map(v=>`<line x1="${left}" y1="${yAt(v)}" x2="${w-right}" y2="${yAt(v)}" stroke="#E9DDE1" stroke-dasharray="4 5"/><text x="${left-9}" y="${yAt(v)+4}" text-anchor="end" fill="#917A85" font-size="12">${v}</text>`).join("")}
    <text x="12" y="12" fill="#917A85" font-size="12">分數</text>
    <line x1="${left}" y1="${bottom}" x2="${w-right}" y2="${bottom}" stroke="#C9AAB7"/>
    ${dates.map(date=>`<text x="${xAt(date)}" y="${bottom+24}" text-anchor="middle" font-size="11" fill="#78646B">${esc(date==='未填日期'?date:date.slice(5))}</text>`).join("")}
    ${bySubject.map(({subject,items})=>items.length>1?`<polyline points="${items.map(item=>`${xAt(item.date||'未填日期')},${yAt(item.score)}`).join(' ')}" fill="none" stroke="${colorOf(subject)}" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>`:"").join("")}
    ${arr.map((item,i)=>{const x=xAt(item.date||'未填日期'),y=yAt(item.score),color=colorOf(String(item.subject||'未分類'));return `<g><circle cx="${x}" cy="${y}" r="18" fill="transparent" role="button" tabindex="0" data-grade-point="${i}" aria-label="${esc(item.subject||'未分類')} ${esc(item.date||'未填日期')} ${esc(item.title||'未命名考卷')} ${esc(item.score)}分"/><circle cx="${x}" cy="${y}" r="6.5" fill="${color}" stroke="white" stroke-width="2" pointer-events="none"/><text x="${x}" y="${Math.max(13,y-14)}" text-anchor="middle" font-size="12" font-weight="700" fill="${color}" pointer-events="none">${esc(item.score)}</text></g>`}).join("")}
    <text x="${w/2}" y="${bottom+44}" text-anchor="middle" fill="#917A85" font-size="12">考試日期（月/日）</text>
    </svg></div><div id="gradePointDetail" class="grade-point-detail" aria-live="polite">👆 點擊圖上的分數點，可以查看考卷名稱與日期。</div>`:'<div class="empty">還沒有考試成績，登記第一筆後就會出現折線圖 ♡</div>';
  $("#content").innerHTML=`
    <h2>📊 成績管理</h2>
    ${isAdmin()?`<section class="grade-section"><div class="top"><h3>✏️ 新成績輸入</h3><button id="toggleGradeForm" class="secondary" type="button">收合輸入區</button></div><div id="gradeEntry"></div></section>`:""}
    <section class="grade-section"><h3>📈 各科成績趨勢</h3><p class="muted">每個科目有自己的折線，不會與其他科目連接。橫軸為考試日期，縱軸為分數（滿分 100 分），點擊分數點查看考卷名稱。</p>${svg}</section>
    <section class="grade-section"><h3>📋 已登記成績（${arr.length} 筆）</h3><div id="records">${arr.length?[...arr].reverse().map(x=>record(x)).join(""):'<div class="empty">尚無登記的成績</div>'}</div></section>`;
  if(isAdmin()){
    editStandard("grades",null,{},"#gradeEntry");
    $("#toggleGradeForm").onclick=()=>{
      const hidden=$("#gradeEntry").classList.toggle("hide");
      $("#toggleGradeForm").textContent=hidden?"展開輸入區":"收合輸入區";
    };
    $("#records").querySelectorAll("[data-edit]").forEach(b=>editButton(b,arr));
    $("#records").querySelectorAll("[data-delete]").forEach(b=>{b.onclick=()=>remove("grades",b.dataset.delete);});
  }
  const showPoint=i=>{
    const item=arr[i];if(!item)return;
    $("#gradePointDetail").innerHTML=`<strong>📝 ${esc(item.title||"未命名考卷")}</strong><div>${esc(item.date||"未填日期")} · ${esc(item.subject||"未分類")} · <strong>${esc(item.score)} / 100 分</strong></div>${item.detail?`<div>${esc(item.detail)}</div>`:""}`;
  };
  $("#content").querySelectorAll("[data-grade-point]").forEach(el=>{
    const activate=()=>showPoint(Number(el.dataset.gradePoint));
    el.addEventListener("click",activate);
    el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();activate();}});
  });
}

/* ========= 學生管理 ========= */
function renderStudentManagement(){
  if(!isAdmin())return;
  $("#content").innerHTML=`
    <h2>👥 學生管理</h2>
    <p class="muted">新增學生後，會自動建立登入帳號和學生資料。老師不會被登出。</p>
    <form id="createStudentForm" class="formgrid">
      <label>學生姓名<input name="name" required maxlength="40" placeholder="例如：王小明"></label>
      <label>英文帳號<input name="username" required minlength="3" maxlength="20" pattern="[a-zA-Z][a-zA-Z0-9_]{2,19}" placeholder="例如：xiaoming"></label>
      <label>初始密碼<input name="password" type="password" required minlength="6" autocomplete="new-password" placeholder="至少 6 碼"></label>
      <div class="actions full"><button type="submit">＋建立學生帳號</button></div>
    </form>
    <h3>目前學生（${allStudentProfiles.length} 位）</h3>
    <div id="manageStudentList">${allStudentProfiles.length?allStudentProfiles.map(s=>`
      <div class="item">
        <div class="top"><div><strong>${esc(s.name||"未命名")}</strong><p class="muted">${esc(s.username||"（舊帳號）")}</p></div>
        <div class="actions" style="margin:0;align-items:center"><span class="pill" style="background:${s.active===false?'#fff0e8':'#e7f8ee'};color:${s.active===false?'#a45235':'#28764b'}">${s.active===false?'已停用':'使用中'}</span><button class="secondary" data-rename-student="${esc(s.uid)}">修改姓名</button><button class="secondary" data-toggle-student="${esc(s.uid)}">${s.active===false?'恢復帳號':'停用帳號'}</button><button class="danger" data-delete-student="${esc(s.uid)}">永久刪除</button></div></div>
      </div>`).join(""):'<div class="empty">目前沒有學生</div>'}</div>
    <p class="muted">停用後學生無法使用網站，資料保留，可隨時恢復。永久刪除會移除登入帳號及所有相關資料，無法復原；請先備份。</p>
  `;
  $("#createStudentForm").onsubmit=async e=>{
    e.preventDefault();
    const form=e.target, button=form.querySelector('button[type="submit"]');
    const f=new FormData(form);
    const name=String(f.get("name")||"").trim();
    const username=String(f.get("username")||"").trim().toLowerCase();
    const password=String(f.get("password")||"");
    if(!name||!/^[a-z][a-z0-9_]{2,19}$/.test(username)||password.length<6){
      msg("請確認姓名、英文帳號與至少 6 碼的密碼",true);return;
    }
    const email=username+"@students.example.com";
    button.disabled=true;
    let createdUid="";
    try{
      // secondary auth 與老師 auth 完全獨立
      const result=await createUserWithEmailAndPassword(studentCreationAuth,email,password);
      createdUid=result.user.uid;
      await setDoc(doc(db,"users",createdUid),{
        name,username,role:"student",active:true
      });
      await signOut(studentCreationAuth);
      await loadStudents();
      msg(`已建立學生：${name}（帳號 ${username}）`);
      renderStudentManagement();
    }catch(error){
      if(createdUid){
        msg("登入帳號已建立，但學生資料儲存失敗。請到 Firebase Authentication 檢查該帳號，避免重複建立。錯誤："+error.message,true);
      }else{
        msg("新增失敗："+error.message,true);
      }
      button.disabled=false;
      try{await signOut(studentCreationAuth);}catch(_e){}
    }
  };
  $("#manageStudentList").querySelectorAll("[data-toggle-student]").forEach(b=>{
    b.onclick=async()=>{
      const uid=b.dataset.toggleStudent;
      const student=allStudentProfiles.find(s=>s.uid===uid);
      if(!student)return;
      const activate=student.active===false;
      if(!confirm(`確定${activate?'恢復':'停用'}「${student.name||student.username||uid}」？${activate?'恢復後可重新使用網站。':'停用後無法使用網站，但資料會保留。'}`))return;
      b.disabled=true;
      try{
        await updateDoc(doc(db,"users",uid),{active:activate});
        await loadStudents();renderStudentManagement();
        msg(activate?'已恢復學生帳號':'已停用學生帳號');
      }catch(e){b.disabled=false;msg('操作失敗：'+e.message,true)}
    };
  });
  $("#manageStudentList").querySelectorAll("[data-delete-student]").forEach(b=>{
    b.onclick=async()=>{
      const uid=b.dataset.deleteStudent;
      const student=allStudentProfiles.find(s=>s.uid===uid);
      if(!student)return;
      const display=student.username||student.name||uid;
      if(!confirm(`⚠️ 永久刪除「${student.name||display}」？\n會刪除登入帳號、作業、成績、寵物、抽獎獎品及日記等資料，無法復原。\n請先備份！`))return;
      const answer=prompt(`最後確認：請輸入學生的英文帳號「${display}」才能永久刪除`);
      if(answer!==display){if(answer!==null)msg('驗證文字不符，已取消刪除',true);return;}
      b.disabled=true;
      try{
        const result=await deleteStudentAccount({uid});
        await loadStudents();renderStudentManagement();
        msg('已永久刪除：'+display);
      }catch(e){b.disabled=false;msg('永久刪除未完成：'+e.message+'。請檢查後端函式部署與 Firebase 計費方案。',true)}
    };
  });
  $("#manageStudentList").querySelectorAll("[data-rename-student]").forEach(b=>{
    b.onclick=async()=>{
      const uid=b.dataset.renameStudent;
      const student=students.find(s=>s.uid===uid);
      if(!student)return;
      const name=prompt("請輸入新的學生姓名",student.name||"");
      if(name===null)return;
      const newName=name.trim();
      if(!newName||newName.length>40){msg("姓名不可為空白，最多 40 字",true);return;}
      b.disabled=true;
      try{
        await updateDoc(doc(db,"users",uid),{name:newName});
        await loadStudents();
        msg("學生姓名已更新");
        renderStudentManagement();
      }catch(error){msg("修改失敗："+error.message,true);b.disabled=false;}
    };
  });
}

/* ========= 登入 ========= */

async function loadStudents(){
  const snap=await getDocs(collection(db,"users"));

  allStudentProfiles=snap.docs.map(d=>({uid:d.id,...d.data()}))
    .filter(x=>x.role==="student")
    .sort((a,b)=>(a.name||"").localeCompare(b.name||""));
  students=allStudentProfiles.filter(x=>x.active===true);

  selected=students.some(x=>x.uid===selected)
    ?selected
    :(students[0]?.uid||"");

  $("#studentPicker").innerHTML=students.map(s=>`
    <option value="${esc(s.uid)}">
      ${esc(s.name||s.uid)}
    </option>
  `).join("");

  $("#studentPicker").value=selected;
}

function setLoginMode(mode){
  loginMode=mode;

  $("#accountLabel").textContent=
    mode==="student"?"英文帳號":"電子郵件";

  const input=$('#loginForm [name="account"]');

  input.type=mode==="student"?"text":"email";
  input.placeholder=mode==="student"
    ?"例如 liwen"
    :"例如 teacher@gmail.com";

  input.value="";

  $("#studentMode").classList.toggle(
    "secondary",mode!=="student"
  );

  $("#teacherMode").classList.toggle(
    "secondary",mode!=="teacher"
  );

  msg("");
}

$("#studentMode").onclick=()=>setLoginMode("student");
$("#teacherMode").onclick=()=>setLoginMode("teacher");

$("#studentPicker").onchange=async e=>{
  selected=e.target.value;
  homeworkFilter="all";
  await reload();
};

$("#loginForm").onsubmit=async e=>{
  e.preventDefault();

  const f=new FormData(e.target);
  let account=String(f.get("account")||"").trim();

  if(loginMode==="student"){
    account=account.toLowerCase();

    if(!/^[a-z][a-z0-9_]{2,19}$/.test(account)){
      msg("英文帳號格式不正確",true);
      return;
    }

    account+="@students.example.com";
  }

  try{
    await signInWithEmailAndPassword(
      auth,account,String(f.get("password")||"")
    );
  }catch(error){
    msg("登入失敗，請確認帳號密碼",true);
  }
};

$("#logout").onclick=()=>signOut(auth);

onAuthStateChanged(auth,async user=>{
  me=user;

  $("#login").classList.toggle("hide",!!user);
  $("#app").classList.toggle("hide",!user);
  $("#logout").classList.toggle("hide",!user);
  $("#menuToggle").classList.toggle("hide",!user);

  if(!user){
    profile=null;
    selected="";
    cache={};
    announcements=[];
    msg("");
    return;
  }

  try{
    const snap=await getDoc(doc(db,"users",user.uid));

    if(!snap.exists()||
       !["teacher","student"].includes(snap.data().role)||
       snap.data().active!==true){
      await signOut(auth);
      msg("帳號尚未設定身分或已停用",true);
      return;
    }

    profile=snap.data();

    $("#welcome").textContent=
      "你好，"+(profile.name||user.email);

    $("#roleInfo").textContent=isAdmin()
      ?"老師管理後台"
      :"我的學習紀錄";

    $("#studentPickerWrap").classList.toggle(
      "hide",!isAdmin()
    );

    if(isAdmin()){
      await loadStudents();
    }

    await reload();
  }catch(error){
    msg("初始化失敗："+error.message,true);
  }
});
</script>
