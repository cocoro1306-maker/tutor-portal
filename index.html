
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>家教學習中心</title>
<style>
:root {
  font-family: system-ui,-apple-system,"Noto Sans TC",sans-serif;
  background:#f4f7fb;
  color:#263449;
}
*{box-sizing:border-box}
body{margin:0}
button,input,select,textarea{font:inherit}
button{
  background:#2563eb;color:white;border:0;border-radius:9px;
  padding:10px 14px;cursor:pointer
}
button.secondary{background:#e8eef8;color:#30415d}
button.danger{background:#c43d43}
button:disabled{opacity:.6;cursor:not-allowed}
input,select,textarea{
  width:100%;padding:10px;border:1px solid #cbd5e1;
  border-radius:8px;background:white
}
textarea{min-height:80px}
.shell{max-width:1100px;margin:auto;padding:20px}
.panel{
  background:white;border-radius:16px;padding:20px;
  margin:15px 0;box-shadow:0 3px 16px #142a4910
}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.muted{color:#64748b}
.hide{display:none!important}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}
.tabs button{background:#e2e8f0;color:#334155}
.tabs button.active{background:#2563eb;color:white}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stat{background:#edf4ff;padding:15px;border-radius:12px}
.stat strong{font-size:25px;display:block}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.formgrid label{display:grid;gap:5px}
.full{grid-column:1/-1}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.item{
  padding:16px;border:1px solid #e2e8f0;
  border-radius:12px;margin:12px 0;overflow-wrap:anywhere
}
.item-head{display:flex;justify-content:space-between;gap:12px;align-items:start}
.pill{
  display:inline-block;padding:4px 9px;border-radius:99px;
  background:#eaf1ff;color:#2457a6;font-size:12px
}
.empty{padding:22px;text-align:center;color:#64748b}
.error{color:#b91c1c}
.success{color:#047857}
.homework-day{
  border:1px solid #dbe4f0;border-radius:14px;
  margin:15px 0;overflow:hidden
}
.day-heading{
  background:#edf4ff;padding:13px 16px;
  display:flex;justify-content:space-between;gap:8px;
  align-items:center;flex-wrap:wrap
}
.day-body{padding:4px 15px}
.hw-row{
  padding:15px 0;border-bottom:1px solid #edf0f5;
  display:flex;justify-content:space-between;gap:14px;
  align-items:center;flex-wrap:wrap
}
.hw-row:last-child{border-bottom:0}
.hw-info{flex:1;min-width:180px}
.hw-info h3{margin:5px 0}
.hw-info p{margin:5px 0}
.hw-controls{min-width:160px;display:grid;gap:6px}
.status{
  display:inline-block;padding:6px 11px;border-radius:99px;
  font-size:13px;font-weight:650
}
.status.unchecked{background:#e2e8f0;color:#475569}
.status.done{background:#dcfce7;color:#166534}
.status.correct{background:#fef3c7;color:#92400e}
.status.missing{background:#fee2e2;color:#991b1b}
.filterbar{
  display:flex;gap:10px;align-items:end;flex-wrap:wrap;
  padding:12px;background:#f8fafc;border-radius:12px
}
.filterbar label{display:grid;gap:5px;min-width:145px}
#message{white-space:pre-wrap}
@media(max-width:650px){
  .shell{padding:12px}
  .panel{padding:15px}
  .grid,.formgrid{grid-template-columns:1fr}
  .hw-controls{width:100%}
}
</style>
</head>
<body>

<div class="shell">
<header class="top">
  <div>
    <h1>📚 家教學習中心</h1>
    <div class="muted">國中理化・數學</div>
  </div>
  <button id="logout" class="secondary hide">登出</button>
</header>

<section id="login" class="panel">
  <h2>帳號登入</h2>
  <div class="actions">
    <button id="studentMode" type="button">學生登入</button>
    <button id="teacherMode" type="button" class="secondary">老師登入</button>
  </div>
  <form id="loginForm" class="formgrid" style="margin-top:15px">
    <label>
      <span id="accountLabel">英文帳號</span>
      <input name="account" required autocomplete="username" placeholder="例如 liwen">
    </label>
    <label>
      密碼
      <input name="password" type="password" required autocomplete="current-password">
    </label>
    <button type="submit">登入</button>
  </form>
</section>

<div id="app" class="hide">
  <section class="panel">
    <div class="top">
      <div>
        <h2 id="welcome"></h2>
        <p id="roleInfo" class="muted"></p>
      </div>
      <label id="studentPickerWrap" class="hide">
        目前管理學生
        <select id="studentPicker"></select>
      </label>
    </div>
    <div id="stats" class="grid"></div>
  </section>

  <nav id="tabs" class="tabs"></nav>
  <section id="content" class="panel"></section>
</div>

<p id="message" role="status"></p>
</div>

<script type="module">
import {firebaseConfig} from "./firebase-config.js";

import {initializeApp} from
"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {
  getAuth,onAuthStateChanged,
  signInWithEmailAndPassword,signOut
} from
"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

import {
  getFirestore,doc,getDoc,collection,query,where,
  getDocs,addDoc,updateDoc,deleteDoc,serverTimestamp
} from
"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

const $=s=>document.querySelector(s);

const names={
  progress:"課程進度",
  homework:"作業管理",
  grades:"考試成績",
  charts:"成績圖表",
  materials:"教材中心",
  mistakes:"錯題追蹤"
};

const fields={
  progress:[
    ["date","日期","date"],
    ["subject","科目","select"],
    ["title","章節／主題"],
    ["detail","上課內容","textarea"],
    ["completion","完成進度（0～100）","number"],
    ["next","下次進度"]
  ],
  grades:[
    ["date","考試日期","date"],
    ["subject","科目","select"],
    ["title","考試名稱／範圍"],
    ["score","得分","number"],
    ["total","滿分","number"],
    ["detail","老師評語","textarea"]
  ],
  materials:[
    ["date","上架日期","date"],
    ["subject","科目","select"],
    ["title","教材名稱"],
    ["url","教材連結","url"],
    ["detail","說明","textarea"]
  ],
  mistakes:[
    ["date","紀錄日期","date"],
    ["subject","科目","select"],
    ["title","錯題觀念／題型"],
    ["detail","錯誤原因","textarea"],
    ["advice","訂正建議","textarea"]
  ]
};

const statusNames={
  unchecked:"未批改",
  done:"已完成",
  correct:"需要訂正",
  missing:"未寫"
};

let me=null;
let profile=null;
let students=[];
let selected="";
let tab="homework";
let cache={};
let loginMode="student";
let homeworkFilter="all";

function esc(value){
  return String(value??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",
    '"':"&quot;","'":"&#39;"
  }[c]));
}

function msg(text,error=false){
  $("#message").textContent=text;
  $("#message").className=error?"error":"success";
}

function isAdmin(){
  return profile?.role==="teacher";
}

function activeUid(){
  return isAdmin()?selected:me?.uid;
}

function today(){
  const d=new Date();
  return [
    d.getFullYear(),
    String(d.getMonth()+1).padStart(2,"0"),
    String(d.getDate()).padStart(2,"0")
  ].join("-");
}

async function load(kind){
  const snap=await getDocs(query(
    collection(db,kind),
    where("studentId","==",activeUid())
  ));

  return snap.docs.map(d=>({
    id:d.id,...d.data()
  })).sort((a,b)=>
    (b.date||"").localeCompare(a.date||"")
  );
}

async function reload(){
  try{
    cache={};
    if(!activeUid()){
      render();
      return;
    }
    for(const kind of Object.keys(names).filter(k=>k!=="charts")){
      cache[kind]=await load(kind);
    }
    render();
  }catch(e){
    msg("資料讀取失敗："+e.message,true);
  }
}

function getStatus(x){
  if(["unchecked","done","correct","missing"].includes(x.status)){
    return x.status;
  }
  if(x.done===true)return "done";
  return "unchecked";
}

function render(){
  const works=cache.homework||[];
  const progress=cache.progress||[];
  const grades=cache.grades||[];

  const stats=[
    ["課程紀錄",progress.length],
    ["需要訂正",works.filter(x=>getStatus(x)==="correct").length],
    ["未寫作業",works.filter(x=>getStatus(x)==="missing").length]
  ];

  $("#stats").innerHTML=stats.map(([name,value])=>`
    <div class="stat">
      <span>${esc(name)}</span>
      <strong>${esc(value)}</strong>
    </div>
  `).join("");

  $("#tabs").innerHTML=Object.entries(names).map(([key,name])=>`
    <button data-tab="${key}" class="${tab===key?"active":""}">
      ${name}
    </button>
  `).join("");

  $("#tabs").querySelectorAll("[data-tab]").forEach(b=>{
    b.onclick=()=>{
      tab=b.dataset.tab;
      render();
    };
  });

  if(!activeUid()){
    $("#content").innerHTML=
      '<div class="empty">請先選擇學生</div>';
    return;
  }

  if(tab==="homework"){
    renderHomework();
    return;
  }

  if(tab==="charts"){
    drawChart();
    return;
  }

  renderStandard();
}

/* ===========================
   作業管理：每日作業表
=========================== */

function renderHomework(){
  const works=cache.homework||[];

  const dates=[...new Set(works.map(x=>x.date).filter(Boolean))]
    .sort((a,b)=>b.localeCompare(a));

  const shown=homeworkFilter==="all"
    ? works
    : works.filter(x=>x.date===homeworkFilter);

  const groups={};

  for(const work of shown){
    const date=work.date||"未設定日期";
    (groups[date]??=[]).push(work);
  }

  $("#content").innerHTML=`
    <div class="top">
      <div>
        <h2>作業管理</h2>
        <p class="muted">
          ${isAdmin()
            ?"設定每日作業，上課批改後記錄學生完成情況。"
            :"查看老師安排的每日作業與批改結果。"}
        </p>
      </div>
      ${isAdmin()
        ?'<button id="addHomework">＋新增作業</button>'
        :""}
    </div>

    <div class="filterbar">
      <label>
        查看日期
        <select id="homeworkDateFilter">
          <option value="all">全部日期</option>
          ${dates.map(d=>`
            <option value="${esc(d)}"
              ${homeworkFilter===d?"selected":""}>
              ${esc(d)}
            </option>
          `).join("")}
        </select>
      </label>
    </div>

    <div id="homeworkList">
      ${Object.keys(groups).length
        ?Object.keys(groups).sort((a,b)=>b.localeCompare(a))
          .map(date=>`
            <section class="homework-day">
              <div class="day-heading">
                <strong>📅 ${esc(date)}</strong>
                <span>${groups[date].length} 項作業</span>
              </div>
              <div class="day-body">
                ${groups[date].map((x,i)=>homeworkRow(x,i)).join("")}
              </div>
            </section>
          `).join("")
        :'<div class="empty">這個日期目前沒有作業</div>'}
    </div>
  `;

  if(isAdmin()){
    $("#addHomework").onclick=()=>editHomework();

    $("#homeworkList").querySelectorAll("[data-edit-hw]").forEach(b=>{
      b.onclick=()=>editHomework(
        works.find(x=>x.id===b.dataset.editHw)
      );
    });

    $("#homeworkList").querySelectorAll("[data-delete-hw]").forEach(b=>{
      b.onclick=()=>remove("homework",b.dataset.deleteHw);
    });

    $("#homeworkList").querySelectorAll("[data-status]").forEach(s=>{
      s.onchange=async()=>{
        const x=works.find(r=>r.id===s.dataset.status);
        if(!x)return;

        const old=getStatus(x);
        s.disabled=true;

        try{
          await updateDoc(doc(db,"homework",x.id),{
            status:s.value,
            done:s.value==="done"
          });
          msg("已更新作業狀態");
          await reload();
        }catch(e){
          s.value=old;
          s.disabled=false;
          msg("更新失敗："+e.message,true);
        }
      };
    });
  }

  $("#homeworkDateFilter").onchange=e=>{
    homeworkFilter=e.target.value;
    renderHomework();
  };
}

function homeworkRow(x,index){
  const status=getStatus(x);

  const controls=isAdmin()?`
    <div class="hw-controls">
      <label>
        批改結果
        <select data-status="${esc(x.id)}">
          ${Object.entries(statusNames).map(([key,name])=>`
            <option value="${key}" ${status===key?"selected":""}>
              ${name}
            </option>
          `).join("")}
        </select>
      </label>
      <div class="actions">
        <button class="secondary" data-edit-hw="${esc(x.id)}">
          編輯
        </button>
        <button class="danger" data-delete-hw="${esc(x.id)}">
          刪除
        </button>
      </div>
    </div>
  `:`
    <div>
      <span class="status ${status}">
        ${statusNames[status]}
      </span>
    </div>
  `;

  return `
    <div class="hw-row">
      <div class="hw-info">
        <span class="pill">${esc(x.subject||"未分類")}</span>
        <h3>${index+1}. ${esc(x.title)}</h3>
        ${x.detail?`<p>${esc(x.detail)}</p>`:""}
        ${x.advice?`
          <p><strong>老師提醒：</strong>${esc(x.advice)}</p>
        `:""}
      </div>
      ${controls}
    </div>
  `;
}

function editHomework(existing=null){
  $("#content").innerHTML=`
    <h2>${existing?"編輯":"新增"}每日作業</h2>
    <p class="muted">
      一項作業建立一筆紀錄，同一天可以新增多項作業。
    </p>

    <form id="homeworkForm" class="formgrid">
      <label>
        作業日期
        <input type="date" name="date" required
          value="${esc(existing?.date||today())}">
      </label>

      <label>
        科目
        <select name="subject">
          ${["數學","理化","生物","其他"].map(s=>`
            <option ${existing?.subject===s?"selected":""}>
              ${s}
            </option>
          `).join("")}
        </select>
      </label>

      <label class="full">
        作業名稱／範圍
        <input name="title" required
          placeholder="例如：數學講義 P.90～96"
          value="${esc(existing?.title||"")}">
      </label>

      <label class="full">
        作業說明
        <textarea name="detail"
          placeholder="例如：完成全部例題與練習題">${esc(existing?.detail||"")}</textarea>
      </label>

      <label class="full">
        老師提醒／訂正內容
        <textarea name="advice"
          placeholder="例如：第 5、8 題需要重新訂正">${esc(existing?.advice||"")}</textarea>
      </label>

      <label>
        批改狀態
        <select name="status">
          ${Object.entries(statusNames).map(([key,name])=>`
            <option value="${key}"
              ${getStatus(existing||{})===key?"selected":""}>
              ${name}
            </option>
          `).join("")}
        </select>
      </label>

      <div class="actions full">
        <button type="submit">儲存作業</button>
        <button type="button" id="cancelHomework" class="secondary">
          取消
        </button>
      </div>
    </form>
  `;

  $("#cancelHomework").onclick=render;

  $("#homeworkForm").onsubmit=async e=>{
    e.preventDefault();

    const f=new FormData(e.target);
    const data={
      date:String(f.get("date")),
      subject:String(f.get("subject")),
      title:String(f.get("title")).trim(),
      detail:String(f.get("detail")).trim(),
      advice:String(f.get("advice")).trim(),
      status:String(f.get("status"))
    };

    if(!data.title){
      msg("請填寫作業名稱",true);
      return;
    }

    data.done=data.status==="done";

    const submit=e.target.querySelector('[type="submit"]');
    submit.disabled=true;

    try{
      if(existing){
        await updateDoc(doc(db,"homework",existing.id),data);
      }else{
        await addDoc(collection(db,"homework"),{
          ...data,
          studentId:selected,
          createdAt:serverTimestamp()
        });
      }

      msg("作業已儲存");
      homeworkFilter="all";
      await reload();
    }catch(error){
      submit.disabled=false;
      msg("儲存失敗："+error.message,true);
    }
  };
}

/* ===========================
   其他學習紀錄
=========================== */

function renderStandard(){
  const arr=cache[tab]||[];

  $("#content").innerHTML=`
    <h2>${names[tab]}</h2>
    ${isAdmin()?`
      <button id="addBtn">＋新增${names[tab]}</button>
    `:""}
    <div id="records">
      ${arr.length
        ?arr.map(record).join("")
        :'<div class="empty">目前沒有紀錄</div>'}
    </div>
  `;

  if(isAdmin()){
    $("#addBtn").onclick=()=>editStandard(tab);

    $("#records").querySelectorAll("[data-edit]").forEach(b=>{
      b.onclick=()=>editStandard(
        tab,arr.find(x=>x.id===b.dataset.edit)
      );
    });

    $("#records").querySelectorAll("[data-delete]").forEach(b=>{
      b.onclick=()=>remove(tab,b.dataset.delete);
    });
  }
}

function record(x){
  const score=x.score!==undefined
    ?`<b>${esc(x.score)} / ${esc(x.total)}
       (${Number(x.total)>0
         ?Math.round(Number(x.score)/Number(x.total)*100)
         :0}%)</b>`
    :"";

  const link=tab==="materials"&&
    /^https:\/\//i.test(x.url||"")
    ?`<a href="${esc(x.url)}" target="_blank"
        rel="noopener noreferrer">開啟教材 ↗</a>`
    :"";

  return `
    <article class="item">
      <div class="item-head">
        <div>
          <span class="pill">${esc(x.subject||"未分類")}</span>
          <small class="muted">${esc(x.date)}</small>
          <h3>${esc(x.title)}</h3>
        </div>
        ${score}
      </div>

      ${x.detail?`<p>${esc(x.detail)}</p>`:""}
      ${x.completion!==undefined
        ?`<p>完成進度：${esc(x.completion)}%</p>`:""}
      ${x.next?`<p>下次：${esc(x.next)}</p>`:""}
      ${x.advice?`<p>訂正建議：${esc(x.advice)}</p>`:""}
      ${link}

      ${isAdmin()?`
        <div class="actions">
          <button class="secondary" data-edit="${esc(x.id)}">
            編輯
          </button>
          <button class="danger" data-delete="${esc(x.id)}">
            刪除
          </button>
        </div>
      `:""}
    </article>
  `;
}

function editStandard(kind,existing=null){
  const formFields=fields[kind];

  const formHTML=formFields.map(([key,label,type="text"])=>{
    let control;

    if(type==="textarea"){
      control=`<textarea name="${key}">${esc(existing?.[key]||"")}</textarea>`;
    }else if(type==="select"){
      control=`<select name="${key}">
        ${["數學","理化","生物","其他"].map(s=>`
          <option ${existing?.[key]===s?"selected":""}>${s}</option>
        `).join("")}
      </select>`;
    }else{
      const value=existing?.[key]??
        (type==="date"?today():"");

      control=`<input name="${key}" type="${type}"
        value="${esc(value)}"
        ${["title","date"].includes(key)?"required":""}
        ${type==="number"?'min="0" step="any"':""}>`;
    }

    return `
      <label class="${type==="textarea"?"full":""}">
        ${label}
        ${control}
      </label>
    `;
  }).join("");

  $("#content").innerHTML=`
    <h2>${existing?"編輯":"新增"}${names[kind]}</h2>
    <form id="entryForm" class="formgrid">
      ${formHTML}
      <div class="actions full">
        <button type="submit">儲存</button>
        <button type="button" class="secondary" id="cancel">取消</button>
      </div>
    </form>
  `;

  $("#cancel").onclick=render;

  $("#entryForm").onsubmit=async e=>{
    e.preventDefault();

    const data=Object.fromEntries(new FormData(e.target));

    for(const key of ["score","total","completion"]){
      if(key in data)data[key]=Number(data[key]);
    }

    if(kind==="grades"&&
      (!(data.total>0)||data.score<0||data.score>data.total)){
      msg("分數需介於 0 與滿分之間",true);
      return;
    }

    if(kind==="progress"&&
      (data.completion<0||data.completion>100)){
      msg("完成進度請填 0～100",true);
      return;
    }

    if(kind==="materials"&&
      !/^https:\/\//i.test(data.url)){
      msg("教材連結必須以 https:// 開頭",true);
      return;
    }

    try{
      if(existing){
        await updateDoc(doc(db,kind,existing.id),data);
      }else{
        await addDoc(collection(db,kind),{
          ...data,
          studentId:selected,
          createdAt:serverTimestamp()
        });
      }

      msg("已儲存");
      await reload();
    }catch(error){
      msg("儲存失敗："+error.message,true);
    }
  };
}

async function remove(kind,id){
  if(!confirm("確定刪除這筆紀錄？"))return;

  try{
    await deleteDoc(doc(db,kind,id));
    msg("已刪除");
    await reload();
  }catch(error){
    msg("刪除失敗："+error.message,true);
  }
}

function drawChart(){
  const arr=[...(cache.grades||[])]
    .sort((a,b)=>(a.date||"").localeCompare(b.date||""))
    .filter(x=>Number(x.total)>0);

  const width=Math.max(500,arr.length*75);

  const points=arr.map((x,i)=>({
    x:50+i*(width-90)/Math.max(1,arr.length-1),
    y:210-Number(x.score)/Number(x.total)*170
  }));

  $("#content").innerHTML=`
    <h2>成績趨勢</h2>
    <p class="muted">以得分百分比比較歷次測驗。</p>
    ${arr.length?`
      <div style="overflow-x:auto">
        <svg width="${width}" height="260"
          viewBox="0 0 ${width} 260"
          role="img" aria-label="考試成績折線圖">
          <line x1="45" y1="40" x2="45" y2="210"
            stroke="#94a3b8"/>
          <line x1="45" y1="210"
            x2="${width-25}" y2="210"
            stroke="#94a3b8"/>
          ${[0,50,100].map(v=>`
            <text x="7" y="${214-v*1.7}"
              font-size="12">${v}%</text>
          `).join("")}
          <polyline
            points="${points.map(p=>p.x+","+p.y).join(" ")}"
            fill="none" stroke="#2563eb" stroke-width="3"/>
          ${points.map((p,i)=>`
            <circle cx="${p.x}" cy="${p.y}" r="5"
              fill="#2563eb">
              <title>${esc(arr[i].title)}</title>
            </circle>
            <text x="${p.x-20}" y="235" font-size="11">
              ${esc((arr[i].date||"").slice(5))}
            </text>
          `).join("")}
        </svg>
      </div>
    `:'<div class="empty">尚無考試成績</div>'}
  `;
}

/* ===========================
   登入與學生選擇
=========================== */

async function loadStudents(){
  const snap=await getDocs(collection(db,"users"));

  students=snap.docs.map(d=>({
    uid:d.id,...d.data()
  }))
  .filter(x=>x.role==="student"&&x.active===true)
  .sort((a,b)=>(a.name||"").localeCompare(b.name||""));

  $("#studentPicker").innerHTML=students.map(s=>`
    <option value="${esc(s.uid)}">
      ${esc(s.name||s.uid)}
    </option>
  `).join("");

  selected=students.some(x=>x.uid===selected)
    ?selected
    :(students[0]?.uid||"");

  $("#studentPicker").value=selected;
  $("#studentPickerWrap").classList.remove("hide");
}

function setLoginMode(mode){
  loginMode=mode;

  $("#accountLabel").textContent=
    mode==="student"?"英文帳號":"電子郵件";

  const input=$('#loginForm [name="account"]');
  input.type=mode==="student"?"text":"email";
  input.placeholder=mode==="student"
    ?"例如 liwen":"例如 teacher@gmail.com";
  input.value="";

  $("#studentMode").classList.toggle(
    "secondary",mode!=="student"
  );
  $("#teacherMode").classList.toggle(
    "secondary",mode!=="teacher"
  );

  msg("");
}

$("#studentMode").onclick=()=>setLoginMode("student");
$("#teacherMode").onclick=()=>setLoginMode("teacher");

$("#studentPicker").onchange=async e=>{
  selected=e.target.value;
  homeworkFilter="all";
  await reload();
};

$("#loginForm").onsubmit=async e=>{
  e.preventDefault();

  const f=new FormData(e.target);
  let account=String(f.get("account")||"").trim();

  if(loginMode==="student"){
    account=account.toLowerCase();

    if(!/^[a-z][a-z0-9_]{2,19}$/.test(account)){
      msg("英文帳號需以英文字母開頭，長度 3～20 字，只能使用英文、數字及底線",true);
      return;
    }

    account+="@students.example.com";
  }

  try{
    await signInWithEmailAndPassword(
      auth,account,String(f.get("password")||"")
    );
  }catch(error){
    msg("登入失敗，請確認帳號密碼",true);
  }
};

$("#logout").onclick=()=>signOut(auth);

onAuthStateChanged(auth,async user=>{
  me=user;

  $("#login").classList.toggle("hide",!!user);
  $("#app").classList.toggle("hide",!user);
  $("#logout").classList.toggle("hide",!user);

  if(!user){
    profile=null;
    selected="";
    cache={};
    msg("");
    return;
  }

  try{
    const snap=await getDoc(doc(db,"users",user.uid));

    if(!snap.exists()||
       !["teacher","student"].includes(snap.data().role)||
       snap.data().active!==true){
      await signOut(auth);
      msg("帳號尚未設定身分或已停用",true);
      return;
    }

    profile=snap.data();

    $("#welcome").textContent=
      "你好，"+(profile.name||user.email);

    $("#roleInfo").textContent=isAdmin()
      ?"老師管理後台":"我的學習紀錄";

    $("#studentPickerWrap").classList.toggle(
      "hide",!isAdmin()
    );

    if(isAdmin())await loadStudents();

    await reload();
  }catch(error){
    msg("初始化失敗："+error.message,true);
  }
});
</script>
