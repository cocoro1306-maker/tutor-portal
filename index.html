
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>家教學習中心</title>
<style>
:root{
  font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;
  color:#263449;background:#f4f7fb
}
*{box-sizing:border-box}
body{margin:0}
button,input,select,textarea{font:inherit}
button{
  border:0;border-radius:9px;padding:10px 14px;
  background:#2563eb;color:white;cursor:pointer
}
button.secondary{background:#e7eef8;color:#30415d}
button.danger{background:#c43d43}
button:disabled{opacity:.55;cursor:not-allowed}
input:not([type=checkbox]),select,textarea{
  width:100%;padding:10px;border:1px solid #cbd5e1;
  border-radius:8px;background:white
}
input[type=checkbox]{width:18px;height:18px;accent-color:#2563eb}
textarea{min-height:80px}
.shell{max-width:1150px;margin:auto;padding:18px}
.panel{
  background:white;border-radius:16px;padding:20px;
  margin:15px 0;box-shadow:0 3px 16px #142a4910
}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.hide{display:none!important}
.muted{color:#64748b}
.error{color:#b91c1c}
.success{color:#047857}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}
.tabs button{background:#e2e8f0;color:#334155}
.tabs button.active{background:#2563eb;color:white}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.formgrid label{display:grid;gap:5px}
.full{grid-column:1/-1}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stat{background:#edf4ff;padding:15px;border-radius:12px}
.stat strong{display:block;font-size:24px}
.item{
  border:1px solid #e2e8f0;border-radius:12px;
  padding:16px;margin:12px 0;overflow-wrap:anywhere
}
.item h3{margin:9px 0}
.pill{
  display:inline-block;background:#eaf1ff;color:#2457a6;
  border-radius:99px;padding:5px 10px;font-size:13px
}
.status{
  display:inline-block;border-radius:99px;
  padding:5px 10px;font-size:13px;font-weight:650
}
.status.unchecked{background:#e2e8f0;color:#475569}
.status.done,.status.present{background:#dcfce7;color:#166534}
.status.correct{background:#fef3c7;color:#92400e}
.status.missing,.status.leave{background:#fee2e2;color:#991b1b}
.empty{padding:22px;text-align:center;color:#64748b}
.curriculum-box{
  border:1px solid #cbdff9;background:#f8fbff;
  border-radius:13px;padding:16px
}
.section-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.section-check,.student-check{
  display:flex!important;flex-direction:row!important;
  align-items:center;gap:8px;padding:10px;
  background:white;border:1px solid #e2e8f0;border-radius:9px
}
.student-list{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;
  margin-top:10px
}
.today-card{
  background:linear-gradient(120deg,#e9f1ff,#f6faff);
  border:1px solid #d3e3ff;border-radius:14px;padding:20px
}
.today-card h2{margin:8px 0}
.schedule{display:flex;flex-wrap:wrap;gap:8px}
.schedule span{
  padding:8px 12px;background:white;border:1px solid #dbe4f0;
  border-radius:10px
}
.hw-day{border:1px solid #dbe4f0;border-radius:13px;margin:14px 0;overflow:hidden}
.day-head{background:#edf4ff;padding:13px 16px;font-weight:650}
.hw-body{padding:4px 15px}
.hw-row{
  display:flex;justify-content:space-between;gap:14px;
  flex-wrap:wrap;align-items:center;padding:15px 0;
  border-bottom:1px solid #edf0f5
}
.hw-row:last-child{border:0}
.hw-info{flex:1;min-width:200px}
.hw-controls{min-width:170px}
.filterbar{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin:14px 0}
.filterbar label{display:grid;gap:5px;min-width:160px}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:480px}
th,td{border-bottom:1px solid #e2e8f0;padding:12px;text-align:left}
th{background:#f8fafc}
#message{white-space:pre-wrap}
@media(max-width:650px){
  .shell{padding:12px}
  .panel{padding:15px}
  .formgrid,.grid,.section-list,.student-list{grid-template-columns:1fr}
  .hw-controls{width:100%}
}
</style>
</head>
<body>
<div class="shell">
<header class="top">
  <div>
    <h1>📚 家教學習中心</h1>
    <div class="muted">數學・理化・生物</div>
  </div>
  <button id="logout" class="secondary hide">登出</button>
</header>

<section id="login" class="panel">
  <h2>帳號登入</h2>
  <div class="actions">
    <button id="studentMode">學生登入</button>
    <button id="teacherMode" class="secondary">老師登入</button>
  </div>
  <form id="loginForm" class="formgrid" style="margin-top:15px">
    <label>
      <span id="accountLabel">英文帳號</span>
      <input name="account" required autocomplete="username">
    </label>
    <label>
      密碼
      <input name="password" type="password" required autocomplete="current-password">
    </label>
    <button type="submit">登入</button>
  </form>
</section>

<div id="app" class="hide">
  <section class="panel">
    <div class="top">
      <div>
        <h2 id="welcome"></h2>
        <p id="roleInfo" class="muted"></p>
      </div>
      <label id="studentPickerWrap" class="hide">
        目前查看學生
        <select id="studentPicker"></select>
      </label>
    </div>
    <div id="stats" class="grid"></div>
  </section>

  <nav id="tabs" class="tabs"></nav>
  <section id="content" class="panel"></section>
</div>

<p id="message" role="status"></p>
</div>

<script type="module">
import {firebaseConfig} from "./firebase-config.js";

import {
  getSubjects,getSemesters,getChapters,getSections
} from "./curriculum.js";

import {initializeApp} from
"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {
  getAuth,onAuthStateChanged,
  signInWithEmailAndPassword,signOut
} from
"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

import {
  getFirestore,doc,getDoc,collection,query,where,
  getDocs,addDoc,updateDoc,deleteDoc,serverTimestamp
} from
"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseApp=initializeApp(firebaseConfig);
const auth=getAuth(firebaseApp);
const db=getFirestore(firebaseApp);
const $=s=>document.querySelector(s);

const schedule={
  3:"理化",
  4:"數學",
  6:"生物"
};

const names={
  home:"今日課程",
  progress:"課程進度",
  homework:"作業管理",
  grades:"考試成績",
  charts:"成績圖表",
  materials:"教材中心",
  mistakes:"錯題追蹤",
  attendance:"出席紀錄"
};

const fields={
  progress:[
    ["date","上課日期","date"],
    ["detail","上課內容","textarea"],
    ["completion","完成進度（0～100）","number"],
    ["next","下次進度"]
  ],
  grades:[
    ["date","考試日期","date"],
    ["score","得分（滿分 100）","number"],
    ["detail","老師評語","textarea"]
  ],
  materials:[
    ["date","上架日期","date"],
    ["url","教材連結","url"],
    ["detail","說明","textarea"]
  ],
  mistakes:[
    ["date","紀錄日期","date"],
    ["detail","錯誤原因","textarea"],
    ["advice","訂正建議","textarea"]
  ]
};

const statusNames={
  unchecked:"未批改",
  done:"已完成",
  correct:"需要訂正",
  missing:"未寫"
};

const attendanceNames={
  present:"出席",
  leave:"請假"
};

let me=null;
let profile=null;
let students=[];
let selected="";
let tab="home";
let cache={};
let loginMode="student";
let homeworkFilter="all";
let initialForm=null;
let formRecipients=[];

function esc(value){
  return String(value??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",
    '"':"&quot;","'":"&#39;"
  }[c]));
}

function msg(text,error=false){
  $("#message").textContent=text;
  $("#message").className=error?"error":"success";
}

function isAdmin(){
  return profile?.role==="teacher";
}

function activeUid(){
  return isAdmin()?selected:me?.uid;
}

function localDate(d=new Date()){
  return [
    d.getFullYear(),
    String(d.getMonth()+1).padStart(2,"0"),
    String(d.getDate()).padStart(2,"0")
  ].join("-");
}

function today(){
  return localDate();
}

function todaySubject(){
  return schedule[new Date().getDay()]||"";
}

function dayName(d){
  return ["日","一","二","三","四","五","六"][d.getDay()];
}

function dateDay(date){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date||""))return "";
  const d=new Date(date+"T12:00:00");
  return dayName(d);
}

function getStatus(x){
  if(["unchecked","done","correct","missing"].includes(x.status)){
    return x.status;
  }
  return x.done===true?"done":"unchecked";
}

function attendanceStatus(x){
  return x?.status==="present"||x?.status==="leave"
    ?x.status:"";
}

function dateSubject(date){
  if(!date)return "";
  const d=new Date(date+"T12:00:00");
  return schedule[d.getDay()]||"";
}

function attendanceKey(uid,date,subject){
  return [uid,date,subject].join("_");
}

/* ========= Firestore ========= */

async function load(kind){
  const snap=await getDocs(query(
    collection(db,kind),
    where("studentId","==",activeUid())
  ));

  return snap.docs.map(d=>({
    id:d.id,...d.data()
  })).sort((a,b)=>
    (b.date||"").localeCompare(a.date||"")
  );
}

async function reload(){
  try{
    cache={};

    if(!activeUid()){
      render();
      return;
    }

    for(const kind of [
      "progress","homework","grades",
      "materials","mistakes","attendance"
    ]){
      cache[kind]=await load(kind);
    }

    render();
  }catch(error){
    msg("資料讀取失敗："+error.message,true);
  }
}

/* ========= 課程選擇器 ========= */

function curriculumSelectorHTML(existing={}){
  const subject=existing.subject||todaySubject()||"數學";

  return `
    <div class="curriculum-box full">
      <h3>📚 選擇科目與章節</h3>

      <div class="formgrid">
        <label>
          科目
          <select id="currSubject" name="subject">
            ${getSubjects().map(s=>`
              <option value="${esc(s)}"
                ${s===subject?"selected":""}>
                ${esc(s)}
              </option>
            `).join("")}
          </select>
        </label>

        <label>
          年級／學期
          <select id="currSemester" name="semester"></select>
        </label>

        <label class="full">
          章節
          <select id="currChapter" name="chapter"></select>
        </label>
      </div>

      <div style="margin-top:14px">
        <div class="top">
          <strong>小節（可複選）</strong>
          <button type="button" class="secondary"
            id="selectAllSections">
            全選／取消全選
          </button>
        </div>
        <div id="currSections" class="section-list"></div>
      </div>
    </div>
  `;
}

function setupCurriculumSelector(existing={}){
  const subjectEl=$("#currSubject");
  const semesterEl=$("#currSemester");
  const chapterEl=$("#currChapter");
  const sectionsEl=$("#currSections");

  if(!subjectEl)return;

  const initialSections=Array.isArray(existing.sections)
    ?existing.sections:[];

  function fillSections(selectedSections=[]){
    const sections=getSections(
      subjectEl.value,
      semesterEl.value,
      chapterEl.value
    );

    sectionsEl.innerHTML=sections.length
      ?sections.map(s=>`
        <label class="section-check">
          <input type="checkbox" name="sections"
            value="${esc(s)}"
            ${selectedSections.includes(s)?"checked":""}>
          <span>${esc(s)}</span>
        </label>
      `).join("")
      :'<p class="muted">此科目尚無小節，可自行輸入名稱。</p>';
  }

  function fillChapters(preferred="",sections=[]){
    const chapters=getChapters(
      subjectEl.value,semesterEl.value
    );

    chapterEl.innerHTML=chapters.map(c=>`
      <option value="${esc(c)}">${esc(c)}</option>
    `).join("");

    if(chapters.includes(preferred)){
      chapterEl.value=preferred;
    }

    fillSections(sections);
  }

  function fillSemesters(preferred="",chapter="",sections=[]){
    const semesters=getSemesters(subjectEl.value);

    semesterEl.innerHTML=semesters.map(s=>`
      <option value="${esc(s)}">${esc(s)}</option>
    `).join("");

    if(semesters.includes(preferred)){
      semesterEl.value=preferred;
    }

    fillChapters(chapter,sections);
  }

  subjectEl.onchange=()=>{
    fillSemesters();
    autoFillTitle();
  };

  semesterEl.onchange=()=>{
    fillChapters();
    autoFillTitle();
  };

  chapterEl.onchange=()=>{
    fillSections();
    autoFillTitle();
  };

  sectionsEl.onchange=autoFillTitle;

  $("#selectAllSections").onclick=()=>{
    const boxes=[...sectionsEl.querySelectorAll(
      'input[type="checkbox"]'
    )];

    const check=boxes.some(x=>!x.checked);
    boxes.forEach(x=>x.checked=check);
    autoFillTitle();
  };

  fillSemesters(
    existing.semester||"",
    existing.chapter||"",
    initialSections
  );
}

function selectedCurriculum(){
  return {
    subject:$("#currSubject")?.value||"其他",
    semester:$("#currSemester")?.value||"",
    chapter:$("#currChapter")?.value||"",
    sections:[...document.querySelectorAll(
      '#currSections input[name="sections"]:checked'
    )].map(x=>x.value)
  };
}

function curriculumTitle(data){
  return data.sections.length
    ?data.sections.join("、")
    :data.chapter||"";
}

function autoFillTitle(){
  const title=$("#recordTitle");
  if(!title||title.dataset.manual==="true")return;
  title.value=curriculumTitle(selectedCurriculum());
}

function bindTitleTracking(existing){
  const title=$("#recordTitle");
  if(!title)return;

  if(existing)title.dataset.manual="true";
  title.oninput=()=>title.dataset.manual="true";

  if(!existing)autoFillTitle();
}

function curriculumDisplay(x){
  const parts=[
    x.semester,
    x.chapter,
    ...(Array.isArray(x.sections)?x.sections:[])
  ].filter(Boolean);

  return parts.length
    ?`<p class="muted">📖 ${parts.map(esc).join("／")}</p>`
    :"";
}

/* ========= 多學生選擇 ========= */

function recipientSelectorHTML(existing=null){
  if(!isAdmin()||existing)return "";

  const defaults=formRecipients.length
    ?formRecipients
    :(selected?[selected]:[]);

  return `
    <div class="curriculum-box full">
      <div class="top">
        <strong>👥 指派學生（可複選）</strong>
        <button type="button" class="secondary"
          id="toggleAllStudents">
          全選／取消全選
        </button>
      </div>

      <div class="student-list" id="recipientList">
        ${students.map(s=>`
          <label class="student-check">
            <input type="checkbox" name="recipient"
              value="${esc(s.uid)}"
              ${defaults.includes(s.uid)?"checked":""}>
            ${esc(s.name||s.uid)}
          </label>
        `).join("")}
      </div>

      <p class="muted">
        同時新增給多位學生後，每位學生的紀錄仍可個別編輯。
      </p>
    </div>
  `;
}

function setupRecipients(){
  const btn=$("#toggleAllStudents");
  if(!btn)return;

  btn.onclick=()=>{
    const boxes=[...document.querySelectorAll(
      '#recipientList input[type="checkbox"]'
    )];

    const check=boxes.some(x=>!x.checked);
    boxes.forEach(x=>x.checked=check);
  };
}

function selectedRecipients(existing){
  if(existing)return [existing.studentId||selected];

  return [...document.querySelectorAll(
    '#recipientList input[name="recipient"]:checked'
  )].map(x=>x.value);
}

async function saveMultiple(kind,data,existing,recipients){
  if(existing){
    await updateDoc(doc(db,kind,existing.id),data);
    return 1;
  }

  if(!recipients.length){
    throw new Error("請至少選擇一位學生");
  }

  for(const studentId of recipients){
    await addDoc(collection(db,kind),{
      ...data,
      studentId,
      createdAt:serverTimestamp()
    });
  }

  return recipients.length;
}

/* ========= 主畫面 ========= */

function render(){
  const works=cache.homework||[];
  const records=cache.progress||[];

  $("#stats").innerHTML=[
    ["課程紀錄",records.length],
    ["需要訂正",works.filter(
      x=>getStatus(x)==="correct"
    ).length],
    ["未寫作業",works.filter(
      x=>getStatus(x)==="missing"
    ).length]
  ].map(([label,value])=>`
    <div class="stat">
      <span>${esc(label)}</span>
      <strong>${esc(value)}</strong>
    </div>
  `).join("");

  $("#tabs").innerHTML=Object.entries(names).map(
    ([key,label])=>`
      <button data-tab="${key}"
        class="${tab===key?"active":""}">
        ${label}
      </button>
    `
  ).join("");

  $("#tabs").querySelectorAll("[data-tab]").forEach(b=>{
    b.onclick=()=>{
      tab=b.dataset.tab;
      render();
    };
  });

  if(!activeUid()){
    $("#content").innerHTML=
      '<div class="empty">請先選擇學生</div>';
    return;
  }

  if(tab==="home")renderHome();
  else if(tab==="homework")renderHomework();
  else if(tab==="charts")drawChart();
  else if(tab==="attendance")renderAttendance();
  else renderStandard();
}

/* ========= 今日首頁 ========= */

function renderHome(){
  const now=new Date();
  const subject=todaySubject();
  const date=today();
  const weekday=dayName(now);

  const works=(cache.homework||[]).filter(
    x=>x.date===date
  );

  const tests=(cache.grades||[]).filter(
    x=>x.date===date
  );

  const lessons=(cache.progress||[]).filter(
    x=>x.date===date
  );

  const att=(cache.attendance||[]).filter(
    x=>x.date===date&&x.subject===subject
  );

  $("#content").innerHTML=`
    <div class="today-card">
      <p class="muted">📅 ${date} 星期${weekday}</p>
      <h2>
        ${subject
          ?"今天上："+subject
          :"今天沒有固定排課"}
      </h2>

      <p>
        ${subject
          ?"已自動設定今天的科目，新增紀錄時不用重新選擇。"
          :"仍可自行新增其他日期或科目的紀錄。"}
      </p>

      ${isAdmin()?`
        <div class="actions">
          <button data-quick="homework">＋今日作業</button>
          <button data-quick="grades">＋今日考試</button>
          <button data-quick="progress">＋今日進度</button>
          <button data-quick="attendance"
            class="secondary">出席登記</button>
        </div>
      `:""}
    </div>

    <h3>每週固定課表</h3>
    <div class="schedule">
      <span>星期三｜理化</span>
      <span>星期四｜數學</span>
      <span>星期六｜生物</span>
    </div>

    <h3>今天的課程與作業</h3>

    ${lessons.length
      ?lessons.map(x=>`
        <div class="item">
          <span class="pill">課程進度</span>
          <h3>${esc(x.title)}</h3>
          ${curriculumDisplay(x)}
          <p>${esc(x.detail||"")}</p>
        </div>
      `).join("")
      :'<p class="muted">今天尚無課程進度紀錄。</p>'}

    ${works.length
      ?works.map(x=>`
        <div class="item">
          <span class="pill">作業</span>
          <h3>${esc(x.title)}</h3>
          ${curriculumDisplay(x)}
          <p>${esc(x.detail||"")}</p>
          <span class="status ${getStatus(x)}">
            ${statusNames[getStatus(x)]}
          </span>
        </div>
      `).join("")
      :'<p class="muted">今天尚無作業。</p>'}

    ${tests.length
      ?tests.map(x=>`
        <div class="item">
          <span class="pill">考試</span>
          <h3>${esc(x.title)}</h3>
          <p>${esc(x.score)} / 100 分</p>
        </div>
      `).join("")
      :'<p class="muted">今天尚無考試紀錄。</p>'}

    ${subject?`
      <h3>今日出席</h3>
      ${att.length
        ?att.map(x=>`
          <p>
            <span class="status ${esc(x.status)}">
              ${attendanceNames[x.status]||"未登記"}
            </span>
            ${esc(x.note||"")}
          </p>
        `).join("")
        :'<p class="muted">尚未登記出席狀態。</p>'}
    `:""}
  `;

  $("#content").querySelectorAll("[data-quick]").forEach(b=>{
    b.onclick=()=>{
      const kind=b.dataset.quick;

      if(kind==="attendance"){
        tab="attendance";
        renderAttendance();
        return;
      }

      formRecipients=[];
      const defaults={
        date,
        subject:subject||"數學"
      };

      if(kind==="homework")editHomework(null,defaults);
      else editStandard(kind,null,defaults);
    };
  });
}

/* ========= 每日作業 ========= */

function renderHomework(){
  const works=cache.homework||[];
  const dates=[...new Set(
    works.map(x=>x.date).filter(Boolean)
  )].sort((a,b)=>b.localeCompare(a));

  const shown=homeworkFilter==="all"
    ?works
    :works.filter(x=>x.date===homeworkFilter);

  const groups={};

  for(const work of shown){
    const d=work.date||"未設定日期";
    (groups[d]??=[]).push(work);
  }

          await updateDoc(doc(db,"homework",x.id),{
            status:s.value,

          await reload();

function editStandard(kind,existing=null,defaults={}){
  const preset={
    ...defaults,
    ...(existing||{})
  };

  const formHTML=fields[kind].map(
    ([key,label,type="text"])=>{
      let control;

      if(type==="textarea"){
        control=`
          <textarea name="${key}">${esc(
            existing?.[key]||""
          )}</textarea>
        `;
      }else{
        const value=existing?.[key]??
          (type==="date"
            ?preset.date||today()
            :"");

        control=`
          <input name="${key}" type="${type}"
            value="${esc(value)}"
            ${key==="date"?"required":""}
            ${type==="number"
              ?'min="0" max="100" step="any"':""}>
        `;
      }

      return `
        <label class="${type==="textarea"?"full":""}">
          ${label}
          ${control}
        </label>
      `;
    }
  ).join("");

  $("#content").innerHTML=`
    <h2>${existing?"編輯":"新增"}${names[kind]}</h2>

    <form id="entryForm" class="formgrid">
      ${recipientSelectorHTML(existing)}
      ${curriculumSelectorHTML(preset)}

      <label class="full">
        名稱／主題
        <input id="recordTitle" name="title" required
          value="${esc(existing?.title||"")}"
          placeholder="選擇章節後自動帶入">
      </label>

      ${formHTML}

      ${kind==="grades"?`
        <div class="full">
          <span class="pill">滿分固定：100 分</span>
        </div>
      `:""}

      <div class="actions full">
        <button type="submit">儲存</button>
        <button type="button" class="secondary"
          id="cancel">取消</button>
      </div>
    </form>
  `;

  setupRecipients();
  setupCurriculumSelector(preset);
  bindTitleTracking(existing);

  $("#cancel").onclick=render;

  $("#entryForm").onsubmit=async e=>{
    e.preventDefault();

    const f=new FormData(e.target);
    const recipients=selectedRecipients(existing);

    if(!recipients.length){
      msg("請至少選擇一位學生",true);
      return;
    }

    const data={
      ...selectedCurriculum(),
      title:String(f.get("title")).trim()
    };

    for(const [key,,type] of fields[kind]){
      const value=String(f.get(key)||"");

      if(type==="number"){
        data[key]=Number(value);
      }else{
        data[key]=value.trim();
      }
    }

    if(kind==="grades"){
      if(!Number.isFinite(data.score)||
         data.score<0||data.score>100){
        msg("考試分數請填 0～100",true);
        return;
      }
      data.total=100;
    }

    if(kind==="progress"&&
       (data.completion<0||data.completion>100)){
      msg("完成進度請填 0～100",true);
      return;
    }

    if(kind==="materials"&&
       !/^https:\/\//i.test(data.url)){
      msg("教材連結請以 https:// 開頭",true);
      return;
    }

    const btn=e.target.querySelector('[type="submit"]');
    btn.disabled=true;

    try{
      const count=await saveMultiple(
        kind,data,existing,recipients
      );

      msg(`已儲存，共 ${count} 位學生`);
      formRecipients=[];
      tab=kind;
      await reload();
    }catch(error){
      btn.disabled=false;
      msg("儲存失敗："+error.message,true);
    }
  };
}

async function remove(kind,id){
  if(!confirm("確定刪除這筆紀錄？"))return;

  try{
    await deleteDoc(doc(db,kind,id));
    msg("已刪除");
    await reload();
  }catch(error){
    msg("刪除失敗："+error.message,true);
  }
}

            </label>
          `).join("")}
        </div>

        <div class="actions">
          <button id="attendanceSave">儲存出席紀錄</button>
          <button id="attendanceSelectAll"
            class="secondary">全選／取消全選</button>
        </div>
      </div>
    `:""}

    <h3>歷史紀錄</h3>

    <div id="attendanceHistory">
      ${arr.length?arr.map(x=>`
        <div class="item">
          <div class="top">
            <div>
              <strong>${esc(x.date)}</strong>
              <span class="pill">${esc(x.subject)}</span>
            </div>
            <span class="status ${esc(x.status)}">
              ${attendanceNames[x.status]||"未登記"}
            </span>
          </div>

          ${x.note?`<p>${esc(x.note)}</p>`:""}

          ${isAdmin()?`
            <div class="actions">
              <button class="secondary"
                data-edit-att="${esc(x.id)}">
                修改
              </button>
              <button class="danger"
                data-delete-att="${esc(x.id)}">
                刪除
              </button>
            </div>
          `:""}
        </div>
      `).join("")
      :'<div class="empty">尚無出席紀錄</div>'}
    </div>
  `;

  if(!isAdmin())return;

  $("#attendanceDate").onchange=e=>{
    const subject=dateSubject(e.target.value);
    if(subject){
      $("#attendanceSubject").value=subject;
    }
  };

  $("#attendanceSelectAll").onclick=()=>{
    const boxes=[...document.querySelectorAll(
      '#attendanceStudents input[type="checkbox"]'
    )];

    const check=boxes.some(x=>!x.checked);
    boxes.forEach(x=>x.checked=check);
  };

  $("#attendanceSave").onclick=async()=>{
    const date=$("#attendanceDate").value;
    const subject=$("#attendanceSubject").value;
    const status=$("#attendanceStatus").value;
    const note=$("#attendanceNote").value.trim();

    const ids=[...document.querySelectorAll(
      '#attendanceStudents input:checked'
    )].map(x=>x.value);

          where("studentId","==",studentId),
          where("date","==",date),
          where("subject","==",subject)

          await addDoc(collection(db,"attendance"),{

      });

      window.scrollTo({top:0,behavior:"smooth"});

  $("#attendanceHistory").querySelectorAll(
    "[data-delete-att]"
  ).forEach(b=>{
    b.onclick=()=>remove(
      "attendance",b.dataset.deleteAtt
    );
  });
}

function drawChart(){
  const arr=[...(cache.grades||[])]
    .sort((a,b)=>
      (a.date||"").localeCompare(b.date||"")
    )
    .filter(x=>
      Number.isFinite(Number(x.score))
    );

  const width=Math.max(500,arr.length*75);

  const points=arr.map((x,i)=>({
    x:50+i*(width-90)/Math.max(1,arr.length-1),
    y:210-Number(x.score)*1.7
  }));

  $("#content").innerHTML=`
    <h2>成績趨勢</h2>
    <p class="muted">所有考試滿分固定 100 分。</p>

    ${arr.length?`
      <div style="overflow-x:auto">
        <svg width="${width}" height="260"
          viewBox="0 0 ${width} 260"
          role="img" aria-label="考試成績折線圖">

          <line x1="45" y1="40"
            x2="45" y2="210"
            stroke="#94a3b8"/>

          <line x1="45" y1="210"
            x2="${width-25}" y2="210"
            stroke="#94a3b8"/>

          ${[0,50,100].map(v=>`
            <text x="7" y="${214-v*1.7}"
              font-size="12">${v}</text>
          `).join("")}

          <polyline
            points="${points.map(
              p=>p.x+","+p.y
            ).join(" ")}"
            fill="none"
            stroke="#2563eb"
            stroke-width="3"/>

          ${points.map((p,i)=>`
            <circle cx="${p.x}" cy="${p.y}"
              r="5" fill="#2563eb">
              <title>${esc(arr[i].title)}</title>
            </circle>

            <text x="${p.x-20}" y="235"
              font-size="11">
              ${esc((arr[i].date||"").slice(5))}
            </text>
          `).join("")}
        </svg>
      </div>
    `:'<div class="empty">尚無考試成績</div>'}
  `;
}

async function loadStudents(){
  const snap=await getDocs(collection(db,"users"));

  students=snap.docs.map(d=>({
    uid:d.id,...d.data()
  })).filter(x=>
    x.role==="student"&&x.active===true
  ).sort((a,b)=>
    (a.name||"").localeCompare(b.name||"")
  );

  selected=students.some(x=>x.uid===selected)
    ?selected
    :(students[0]?.uid||"");

  $("#studentPicker").innerHTML=students.map(s=>`
    <option value="${esc(s.uid)}">
      ${esc(s.name||s.uid)}
    </option>
  `).join("");

  $("#studentPicker").value=selected;
}

function setLoginMode(mode){
  loginMode=mode;

  $("#accountLabel").textContent=
    mode==="student"?"英文帳號":"電子郵件";

  const input=$('#loginForm [name="account"]');

  input.type=mode==="student"?"text":"email";
  input.placeholder=mode==="student"
    ?"例如 liwen"
    :"例如 teacher@gmail.com";

  input.value="";

  $("#studentMode").classList.toggle(
    "secondary",mode!=="student"
  );

  $("#teacherMode").classList.toggle(
    "secondary",mode!=="teacher"
  );

  msg("");
}

$("#studentMode").onclick=()=>setLoginMode("student");
$("#teacherMode").onclick=()=>setLoginMode("teacher");

$("#studentPicker").onchange=async e=>{
  selected=e.target.value;
  homeworkFilter="all";
  await reload();
};

$("#loginForm").onsubmit=async e=>{
  e.preventDefault();

  const f=new FormData(e.target);
  let account=String(f.get("account")||"").trim();

  if(loginMode==="student"){
    account=account.toLowerCase();

    if(!/^[a-z][a-z0-9_]{2,19}$/.test(account)){
      msg("英文帳號格式不正確",true);
      return;
    }

    account+="@students.example.com";
  }

  try{
    await signInWithEmailAndPassword(
      auth,account,String(f.get("password")||"")
    );
  }catch(error){
    msg("登入失敗，請確認帳號密碼",true);
  }
};

$("#logout").onclick=()=>signOut(auth);

onAuthStateChanged(auth,async user=>{
  me=user;

  $("#login").classList.toggle("hide",!!user);
  $("#app").classList.toggle("hide",!user);
  $("#logout").classList.toggle("hide",!user);

  if(!user){
    profile=null;
    selected="";
    cache={};
    msg("");
    return;
  }

  try{
    const snap=await getDoc(doc(db,"users",user.uid));

    if(!snap.exists()||
       !["teacher","student"].includes(snap.data().role)||
       snap.data().active!==true){
      await signOut(auth);
      msg("帳號尚未設定身分或已停用",true);
      return;
    }

    profile=snap.data();

    $("#welcome").textContent=
      "你好，"+(profile.name||user.email);

    $("#roleInfo").textContent=isAdmin()
      ?"老師管理後台"
      :"我的學習紀錄";

    $("#studentPickerWrap").classList.toggle(
      "hide",!isAdmin()
    );

    if(isAdmin()){
      await loadStudents();
    }

    await reload();
  }catch(error){
    msg("初始化失敗："+error.message,true);
  }
});
</script>
</body>
</html>
